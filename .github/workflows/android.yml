# Builds the Android app on every push to main (or by hand: Actions -> Android APK -> Run workflow).
# The APK appears in Releases as tokyo-drift.apk — open it on the phone and install.
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ 'web/chess/**' ]   # the chess web page doesn't change the app
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        shell: bash
        run: bash scripts/ci-build.sh 2>&1 | tee ci.log
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" tokyo-drift.apk \
            --title "Занос Токио — сборка ${{ github.run_number }}" \
            --notes "Открой на телефоне, скачай tokyo-drift.apk и установи. Новая сборка ставится поверх старой, сохранения остаются." \
            --latest
      - name: Keep APK and log on the ci-out branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out
          cp ci.log /tmp/out/ 2>/dev/null || true
          cp tokyo-drift.apk /tmp/out/ 2>/dev/null || true
          echo "${{ job.status }} run ${{ github.run_number }} ${{ github.sha }}" > /tmp/out/STATUS
          cd /tmp/out
          git init -q -b ci-out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ci run ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-out
