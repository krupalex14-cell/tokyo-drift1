:root{--bg:#171226;--panel:#251d3d;--line:#45386b;--ink:#fbeff6;--muted:#a898c8;--pk:#ff6fae;--pk2:#ff3d8b;--cy:#6ee7ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"TokyoPx","Courier New",Courier,monospace;font-synthesis:none;font-weight:700;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;font-synthesis:none;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:var(--bg)}
h1{margin:0;font-size:33px;letter-spacing:.06em;text-shadow:3px 3px 0 var(--pk2);line-height:1}
h1 span{display:block;font-size:16.5px;letter-spacing:.5em;color:var(--cy);text-shadow:none;margin-top:6px}
.bar{width:min(320px,80vw);height:14px;border:3px solid var(--line);background:#0e0a1a}.bar i{display:block;height:100%;width:0;background:var(--pk);transition:width .2s}
#load p{color:var(--muted);margin:0}
#gar{display:none;max-width:560px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 30px max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.coins{background:var(--panel);border:3px solid var(--line);padding:6px 12px;color:var(--cy)}
#pv{width:100%;display:block;border:3px solid var(--line);image-rendering:pixelated}
.sec{margin:18px 0 8px;color:var(--muted)}
.desc{color:var(--muted);font-size:16.5px;margin-top:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--panel);border:3px solid var(--line);padding:10px 4px;font-size:16.5px;display:flex;flex-direction:column;gap:4px;align-items:center}
.card small{color:var(--muted);font-size:11px}
.card.on{border-color:var(--pk);box-shadow:4px 4px 0 var(--pk2)}
.card.cur small{color:var(--cy)}
.cinfo{background:var(--panel);border:3px solid var(--line);padding:10px 12px;margin-top:10px}.cinfo>b{display:block;font-weight:inherit;font-size:16.5px;color:var(--pk)}.cinfo .desc{margin:2px 0 8px;font-size:11px}
.cst{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:11px;color:var(--muted)}.cst span{width:86px}.cst i{flex:1;height:7px;background:#0e0a1a}.cst i u{display:block;height:100%;background:var(--cy);text-decoration:none}
.cbt{display:flex;gap:8px;margin-top:10px;align-items:center}.cbt .buy{flex:1}.buy.td{background:#ffd23a;color:#2a2008;box-shadow:3px 3px 0 #9a7a10;flex:0 0 auto}.buy.sure{background:var(--pk);color:#2a0d1c;box-shadow:3px 3px 0 var(--pk2)}
.cok{flex:1;color:var(--cy);font-size:11px}
.buy.lk{background:#3a3050;color:#8a7ea8;box-shadow:none}
#tdb{display:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 150px);transform:translateX(-50%);z-index:6;align-items:center;gap:8px;background:rgba(42,32,8,.94);padding:6px 8px 6px 12px;box-shadow:0 -3px 0 0 #ffd23a,0 3px 0 0 #ffd23a,-3px 0 0 0 #ffd23a,3px 0 0 0 #ffd23a;white-space:nowrap}#tdb span{color:#ffd23a;font-size:11px}#tdb em{display:none}#tdb button{border:0;background:#ffd23a;color:#2a2008;font-size:11px;padding:6px 10px}
.code{display:flex;gap:8px}.code input{flex:1;min-width:0;background:#0e0a1a;border:3px solid var(--line);color:#fbeff6;font:inherit;font-size:16.5px;padding:8px 10px;letter-spacing:.2em}.code button{border:0;background:var(--cy);color:#06202a;padding:0 16px;font-weight:900}
.dev{background:#1a2a20;border:3px solid #7dff8c;padding:10px 12px;margin-top:6px}.dev h3{margin:0 0 6px;color:#7dff8c;font-size:16.5px;font-weight:inherit}.dev .dch{color:#b8f0c0;font-size:11px;margin:10px 0 4px;letter-spacing:.1em}.dev .dms{display:grid;grid-template-columns:1fr 1fr;gap:5px}.dev .dms button{border:0;background:#24402c;color:#e8ffe8;font-size:11px;padding:7px 6px;text-align:left}.dev .dms button.on{background:#7dff8c;color:#0e2a14}.dev .dbt2{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.dev .dbt2 button{flex:1;border:0;background:#7dff8c;color:#0e2a14;font-size:11px;padding:8px 6px;font-weight:900}.dev .dbt2 button.off{background:#3a2c58;color:#fbeff6}
.lkn{margin-top:10px;background:#2a2008;border:3px solid #ffd23a;padding:9px 12px;font-size:11px;color:#ffe9a8;line-height:1.45}.lkn .buy{display:block;width:100%;margin-top:8px;background:#ffd23a;color:#2a2008;box-shadow:3px 3px 0 #9a7a10}
.part{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:3px solid var(--line);padding:10px 12px;margin-bottom:8px}
.part small{color:var(--muted);font-weight:400;font-size:11px}
.pips{display:flex;gap:4px;margin-top:6px}.pips i{width:24px;height:8px;background:var(--line)}.pips i.f{background:var(--pk)}
.buy{background:var(--cy);color:#06202a;border:0;padding:9px 12px;font-weight:900;box-shadow:3px 3px 0 #1d6f86;white-space:nowrap}
.mx{color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:9px}.sw button{width:40px;height:40px;border:3px solid #000;font-size:16.5px}.sw button.on{border-color:#fff;box-shadow:3px 3px 0 var(--pk2)}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opts button{background:var(--panel);border:3px solid var(--line);padding:9px 10px;font-size:16.5px}
.go{display:block;width:100%;margin:22px 0 0;padding:16px;border:0;background:var(--pk);color:#2a0d1c;font-size:22px;font-weight:900;box-shadow:5px 5px 0 var(--pk2)}
.go.alt{background:var(--cy);color:#06202a;box-shadow:5px 5px 0 #1d6f86;margin-top:14px;font-size:16.5px}
.zl div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:2px solid var(--line);font-size:16.5px}.zl b{color:#ffd23a}.zl em{color:var(--line);font-style:normal}
.hint{color:var(--muted);font-size:11px;font-weight:400}
#game{position:fixed;inset:0;display:none;background:#10121e;touch-action:none;overflow:hidden}
#c{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:2px 2px 0 #000;z-index:2}
#tl{position:absolute;left:10px;top:calc(8px + env(safe-area-inset-top))}
#sc{font-size:27.5px;line-height:1}
.lbl{font-size:11px;color:#d8cdf0;margin-bottom:6px}
#mm{width:112px;height:112px;border:0;margin:3px;box-shadow:0 -3px 0 0 rgba(20,16,40,.95),0 3px 0 0 rgba(20,16,40,.95),-3px 0 0 0 rgba(20,16,40,.95),3px 0 0 0 rgba(20,16,40,.95),0 6px 0 0 rgba(0,0,0,.3);border-radius:0;background:#151a2c;pointer-events:auto}
#tr{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top));text-align:right;display:flex;flex-direction:column;align-items:flex-end}
#sp{font-size:27.5px;line-height:1}
.trb{display:flex;gap:10px;margin-top:8px;margin-right:3px}#tr .trb button{pointer-events:auto;background:rgba(37,29,61,.9);border:0;box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),inset 0 -3px 0 0 rgba(0,0,0,.3);padding:6px 9px;font-size:16.5px;text-shadow:none}#tr .trb .ib{padding:3px 6px;display:flex;align-items:center;color:var(--cy)}.ib svg{width:22px;height:22px;display:block}#tr .trb button:active{background:#45386b}
#zp{display:none;pointer-events:auto;margin-top:8px;width:186px;background:rgba(23,18,38,.94);border:3px solid var(--pk);padding:8px 10px 10px;text-align:left;text-shadow:none;box-shadow:4px 4px 0 rgba(255,61,139,.45)}#zp.on{display:block;animation:zpin .25s ease-out}
@keyframes zpin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
#zp .zk{font-size:11px;letter-spacing:.16em;color:var(--pk)}#zp .zn{font-size:16.5px;margin:2px 0 5px;line-height:1.1}#zp .zi{font-size:11px;color:var(--muted);font-weight:400;line-height:1.4}#zp .zi b{color:#ffd23a;font-weight:700}#zp .zi span{color:#3a3050}
#zp .zbt{display:flex;gap:6px;margin-top:8px}#zp .zbt button{border:0;padding:9px 0;font-size:16.5px;font-weight:900}#zp .zbt button:first-child{flex:1;background:var(--pk);color:#2a0d1c;box-shadow:3px 3px 0 var(--pk2)}#zp .zbt button:last-child{width:40px;background:#3a2c58;color:#fff}
#tc{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));width:min(60vw,320px);text-align:center}
#zb{display:none;width:186px;background:rgba(23,18,38,.9);border:3px solid var(--pk);padding:6px 9px 7px;font-size:16.5px;margin-top:8px;text-shadow:none;text-align:left}

 "Второе испытание Гэна. После него он с тобой заговорит.":"玄的第二次考验。之后他会跟你谈。",
 "Король Скрамбла":"十字路口之王",
 "Привези Хану на Скрамбл и обыграй Гэна за 45 секунд":"载花去十字路口，在45秒内分数超过玄",
 "Выигрыш закроет взнос, а победа над Гэном приведёт клиентов.":"奖金够还款，赢了玄还能带来客人。",
 "Вечер у башни":"塔下的夜晚",
 "Отвези Хану к Токийской башне, потом домой. Камера у неё на коленях — без ударов":"载花去东京塔，再送她回家。相机放在她腿上——不许碰撞",
 "Хана просила ночной кадр башни. Ну и… просто побыть вдвоём.":"花想拍东京塔的夜景。还有……就是想一起待一会儿。",
 "Первый взнос":"首期还款",
 "Внеси первый взнос — 2 000 ¥":"支付首期还款——2000 ¥",
 "Не внесёшь — мастерская Миши уйдёт Кагэяме.":"错过还款，米沙的车库就归影山了。",
 "Найди Рэйко у перевала Акаги":"去赤城山道找玲子",
 "вечер · перевал Акаги":"傍晚 · 赤城山道",
 "Получить у Рэйко ключ от ячейки Миши и внести второй взнос":"从玲子那里拿到米沙储物柜的钥匙，并支付第二期还款",
 "Доки":"码头",
 "ночь · порт":"夜晚 · 港口",
 "Раменная у перевала":"山道拉面",
 "Доедь до раменной у подножия перевала Акаги":"开到赤城山道脚下的拉面店",
 "Ключ от ячейки Миши у Рэйко Сато. Та самая девушка с фото?":"米沙储物柜的钥匙在佐藤玲子手里。是照片上的那个女孩？",
 "Урок 1. Линия":"第一课：路线",
 "Кольцо Синдзю: держись линии и набери 4 000":"新珠环线：守住路线，拿到4000分",
 "Первый урок Рэйко. Без него ключа не будет.":"玲子的第一课。不上课就没有钥匙。",
 "Урок 2. Поймай":"第二课：接住",
 "Пять раз: глубокий занос (ручник и руль до упора), а когда появится «Лови!» — выровняй машину":"五次：深度侧滑（手刹加方向打满），出现“接住！”时把车回正",
 "Второй урок Рэйко: пьяный падает, а ты ловишь.":"玲子的第二课：醉汉摔倒，你来接住。",
 "Урок 3. Хвост":"第三课：紧跟",
 "Пройди перевал Акаги за Рэйко: держись близко, но не касайся":"在赤城山道跟着玲子跑：贴近，但别碰到",
 "Третий урок. После него Рэйко отдаст ключ.":"第三课。之后玲子会把钥匙给你。",
 "Ночной кадр":"夜景镜头",
 "Отвези Хану к Токийской башне и набери 800 очков заносом в неоне":"载花去东京塔，在霓虹中拿到800漂移分",
 "Заказ для канала Ханы: деньги на второй взнос. Ну и Хана.":"花的频道接到一单：第二期还款的钱。还有，嗯，花。",
 "Подрезали":"甩开",
 "Оторвись от Рин Мори за минуту":"一分钟内甩掉森凛",
 "Рин хочет, чтобы Рэйко закрыла раменную. И начала с тебя.":"凛想逼玲子关掉拉面店。她要先拿你开刀。",
 "Кофе и рекорд":"咖啡与纪录",
 "Побей рекорд Сидзуки на перевале Акаги":"打破静香在赤城山道的纪录",
 "Сидзука обещала оставить раменную в покое, если её рекорд падёт.":"静香答应：如果纪录被破，她就不再找拉面店的麻烦。",
 "Записка №1":"笔记一",
 "Забери у монаха Сэнсо-дзи первую записку Миши":"从浅草寺的僧人那里取回米沙的第一张笔记",
 "Монах, у которого Миша ставил свечу «за ту ночь на Кумо», что-то для тебя хранит.":"米沙曾在那里“为云山那一夜”点蜡烛，那位僧人替你保管着一样东西。",
 "Сёстры Мори":"森姐妹",
 "Обгони Рин и Сидзуку на перевале Акаги и финишируй первым":"在赤城山道战胜凛和静香，第一个冲线",
 "Победа — и перевал, и раменная остаются за Рэйко. И ключ.":"赢了，山道和拉面店就还是玲子的。钥匙也是。",
 "Второй взнос":"第二期还款",
 "Внеси второй взнос — 3 000 ¥ — и открой ячейку Миши":"支付第二期还款——3000 ¥——然后打开米沙的储物柜",
 "Ключ у тебя. И мастерская всё ещё в залоге.":"钥匙到手了。可车库还在抵押中。",
 "Встреть Кира в порту":"去港口见基尔",
 "Токио. Письмо от нотариуса, ключи у какой-то бабушки Тоё… Дядь Миш, ну ты и забрался.":"东京。公证人的信，钥匙在某位丰婆婆那里……米沙叔叔，你可真跑得够远的。",
 "И последняя строчка: «Мастерская твоя. Не продавай. Она ещё не доехала». Кто — «она»?":"最后一行写着：“车库归你了。别卖掉。她还没跑完。”“她”是谁？",
 "Ты Миша-младший? Похож. Так же криво паркуешься.":"你就是米沙家的小子？长得真像他。停车也一样歪。",
 "Я ещё даже не парковался.":"我还没停车呢。",
 "Вот и я о том же. Миша просил тебя встретить. Держи ключи — мастерская у Сэнсо-дзи, розовые стрелки доведут.":"我就是这个意思。米沙让我来接你。钥匙给你——车库在浅草寺旁边，跟着粉色箭头走。",
 "Как обустроишься — загляни ко мне в ларёк у пагоды. У меня кое-что от него осталось.":"安顿好了就来宝塔旁边我的小摊坐坐。我这儿有他的东西。",
 "Так вот ты какая… Сакура. «Она ещё не доехала» — это про тебя?":"原来你就是……“樱花”。“她还没跑完”——说的是你吧？",
 "Эй! Ты кто такой и что делаешь у мастерской Миши?":"喂！你是谁？在米沙的车库干什么？",
 "Я Лёха. Племянник. Мастерская теперь моя.":"我是廖哈，他侄子。现在车库是我的了。",
 "…Хана. У меня лавка запчастей на заправке в Шопинге. Миша был моим лучшим клиентом.":"……我叫花。我在购物区的加油站开配件店。米沙是我最好的客人。",
 "Слышишь, как стучит мотор? Сакура еле живая. Миша заказал у меня детали, но так и не забрал.":"听见引擎在敲吗？“樱花”只剩一口气了。米沙在我这儿订了配件，却一直没来取。",
 "Так давай их сюда.":"那就给我吧。",
 "В долг даю только тем, кто умеет ездить. Приезжай в лавку — посмотрим, что ты можешь.":"我只赊给会开车的人。来我店里——让我看看你有几斤几两。",
 "Ну, показывай. Зажми ручник и поверни. Без руля машина едет ровно, с рулём — сразу занос.":"来吧，露两手。按住手刹再打方向。不打方向车子直行，打方向就会侧滑。",
 "Набери 400 очков, и я поверю, что ты не просто болтаешь.":"拿到400分，我就信你不是光说不练。",
 "Ладно, не врал. Виляешь ужасно, но машину держишь.":"行，你没吹牛。晃得厉害，但车还算稳得住。",
 "Это стиль.":"这叫风格。",
 "Стиль… Детали я дам. Только они застряли на складе в порту, а мой фургон сломан.":"风格……配件给你。只是它们卡在港口仓库，我的面包车又坏了。",
 "Съезди за коробкой. Она хрупкая — там стёкла фар и датчики.":"去把箱子取回来。里面是易碎品——车灯玻璃和传感器。",
 "Коробка ждёт на складе в порту, на моё имя. Мой фургон сломан — поеду с тобой.":"箱子在港口仓库等着，写的是我的名字。我的车坏了——我跟你一起去。",
 "Заберём — и сразу в мастерскую, там и поставлю. Каждый удар — минус из твоей платы.":"取了就直接回车库，我在那儿装。每撞一下都从你的工钱里扣。",
 "А если совсем без ударов?":"那要是一下都不撞呢？",
 "Тогда я, так и быть, удивлюсь.":"那我说不定真会刮目相看。",
 "Коробка для Ханы? Раньше за ней Миша сам приезжал. Каждый месяц, как часы.":"给花的箱子？以前都是米沙亲自来取。每个月一次，雷打不动。",
 "Говорил, однажды соберёт Сакуру и снова поедет на Кумо. Держи. И не гони, там стекло.":"他说总有一天要把“樱花”修好，再去跑一趟云山。拿着吧。别急，里面是玻璃。",
 "Кумо?.. Он мне про него никогда не рассказывал. Поехали в мастерскую.":"云山？……他从没跟我提过。去车库吧。",
 "Ну… половина стёкол жива. Остальное докуплю.":"唉……玻璃保住了一半。剩下的我再买。",
 "Ни царапины. Беру тебя в курьеры.":"一点划痕都没有。你被录用了，当我的快递员。",
 "Готово. Заводи.":"装好了。发动吧。",
 "…Не стучит. Сакура задышала!":"……不敲了。“樱花”喘过气来了！",
 "Ещё бы. Кстати, бабушка Тоё звонила мне три раза: «Где мальчик?» Она тридцать лет кормила Мишу. Заедь к ней, ларёк у пагоды.":"当然。对了，丰婆婆给我打了三次电话：“那孩子呢？”她给米沙做了三十年的饭。去看看她吧，就在宝塔旁边的小摊。",
 "Пришёл всё-таки. Садись, слушай.":"你还是来了。坐下，听我说。",
 "Тридцать лет Миша каждое утро развозил мои онигири: охраннику у замка, смотрителю колеса и монаху в Сэнсо-дзи.":"三十年来，米沙每天早上替我送饭团：给城堡的守卫、摩天轮的管理员，还有浅草寺的僧人。",
 "Они до сих пор ждут. Никто им не сказал. Я не смогла.":"他们还在等。没人告诉他们。我说不出口。",
 "Хочешь, чтобы сказал я?":"你想让我去告诉他们？",
 "Хочу, чтобы ты довёз их горячими. Уложись в три минуты! А потом возвращайся — расскажешь, что они сказали.":"我想让他们吃到热的。三分钟内送到！然后回来告诉我他们说了什么。",
 "На карте можно ставить метки — она сама покажет дорогу.":"你可以在地图上放标记——它会给你指路。",
 "Онигири? А где Миша?.. Вот как.":"饭团？米沙呢？……我明白了。",
 "Он всегда влетал во двор боком. Говорил, лучше этого поворота в городе нет. Разве что на Кумо.":"他总是侧滑着冲进院子。说全城没有比这更好的弯道了。除了云山。",
 "Ты на него похож. Он здесь катался последний раз лет двенадцать назад.":"你长得像他。他最后一次来这儿，大概是十二年前。",
 "С девушкой. Волосы серебряные, а сама молодая. Больше я её не видел. Да и его — таким счастливым.":"带着一个姑娘。银色的头发，却那么年轻。后来我再也没见过她。也没见他那么开心过。",
 "Серебряные…":"银色的……",
 "Значит, Миша ушёл. Каждый месяц он ставил здесь свечу.":"原来米沙走了。他每个月都在这里点一支蜡烛。",
 "Всегда с одними словами: «За ту ночь на Кумо». Что это значит, он не говорил.":"每次都说同一句话：“为了云山的那一夜。”他从没说过那是什么意思。",
 "Онигири развёз. Теперь назад к Тоё.":"饭团送完了。现在回丰婆婆那里。",
 "Вернулся. Горячими довёз? Миша возил так же. Только он ещё и пел.":"你回来了。还是热的吗？米沙也是这样开车的。只不过他还会唱歌。",
 "Тоё-сан, смотритель колеса видел Мишу с девушкой. Волосы серебряные. А монах говорит про какую-то «ночь на Кумо».":"丰婆婆，摩天轮的管理员见过米沙和一个姑娘在一起。银色头发。僧人还提到什么“云山之夜”。",
 "…Значит, пора. Миша оставил для тебя вот это.":"……那就是时候了。这是米沙留给你的。",
 "Фото. Дядя молодой… и она. Горы, перевал Акаги. На обороте: «Спроси у перевала».":"一张照片。年轻的叔叔……还有她。群山，赤城山道。背面写着：“去问山道。”",
 "А теперь о плохом. Приходил Окада из банка, искал тебя. Мастерская заложена. Езжай в банк у Скайтри, пока он не пришёл сам.":"现在说坏消息。银行的冈田来找过你。车库被抵押了。在他亲自上门之前，去晴空塔旁边的银行一趟吧。",
 "Алексей-сан? Проходите. Окада, банк «Сакура-Траст». Примите мои соболезнования.":"阿列克谢先生？请进。我是樱花信托银行的冈田。请节哀。",
 "Ваш дядя заложил мастерскую. Долг — тридцать тысяч иен. Первый взнос, две тысячи, — до конца месяца.":"您的叔叔把车库抵押了。欠款三万日元。首期还款两千，月底前要付。",
 "А если не внесу?":"要是我不还呢？",
 "Мастерскую продадут. Покупатель уже есть — господин Кагэяма. Очень щедрый человек. И очень терпеливый.":"车库会被卖掉。已经有买家了——影山先生。一位非常慷慨的人。也非常有耐心。",
 "Но я очень, очень на вас надеюсь.":"不过我对您，抱有非常、非常大的期望。",
 "(выйдя из банка) Хана, где за месяц взять две тысячи?":"（走出银行）花，一个月里去哪儿弄两千？",
 "На Скрамбле. Там толпа и камеры. Покажешь заносы — я сниму, просмотры приведут клиентов в мастерскую.":"去十字路口。人多，镜头多。给他们看你的漂移——我来拍，播放量会把客人带到车库来。",
 "Заезжай за мной в лавку, камеру возьму.":"到店里接我，我带上相机。",
 "Камеру взяла. Поехали на Скрамбл — главный перекрёсток города, там тебя увидят все.":"相机带好了。去十字路口吧——全城最大的路口，所有人都会看到你。",
 "Приехали. Толпа, камеры, неон. Набери 600 очков заносом — я снимаю.":"到了。人群、镜头、霓虹。拿到600漂移分——我在拍。",
 "Ты это специально так виляешь?":"你是故意这么晃的吗？",
 "Конечно. Это стиль.":"当然。这叫风格。",
 "Тогда у стиля уже есть имя. Весь Скрамбл зовёт тебя «ёппарай». Пьяный.":"那这风格已经有名字了。整个十字路口都叫你“醉鬼”。",
 "Да я трезвый, как стекло!":"我清醒得很！",
 "Им это не объяснишь. Сорок тысяч просмотров за час. И смотри, кто написал под видео.":"你去跟他们说吧。一小时四万播放。再看看是谁留的言。",
 "«Виляет как пьяный. Пройдёт Кольцо Нака по линии и Эстакаду С1 — тогда поговорим. Гэн»":"“晃得像个醉鬼。要是他能沿着路线跑完中环线，再跑一趟C1高架——到时候再谈。玄”",
 "Кто такой Гэн?":"玄是谁？",
 "Король Скрамбла. Кого он признаёт, к тому очередь клиентов. Нам это нужно, Лёха.":"十字路口之王。他看得起谁，谁的门口就排满客人。我们需要这个，廖哈。",
 "Я на метро — монтировать. Соберёшься на Нака — заезжай за мной, сниму для Гэна.":"我坐地铁回去剪片子。准备好跑中环线了就来接我——我替玄拍下来。",
 "Едем на Кольцо Нака. Гэн будет смотреть запись, так что без позора.":"我们去中环线。玄会看录像，别给我们丢脸。",
 "На кольцах считают не занос, а линию. Видишь розовую траекторию? Чем ближе к ней, тем больше очков.":"环线上不算漂移分，算的是路线。看到粉色的路径了吗？贴得越近，分数越高。",
 "По часовой. Против хода — ноль. Камера пишет.":"顺时针。逆着跑一分都没有。开拍了。",
 "Чисто. Почти. Отправила Гэну — уже лайкнул.":"很干净。差不多吧。发给玄了——他已经点赞了。",
 "Осталась Эстакада С1. Туда он тебя позовёт сам. Там узко и быстро — не вздумай вилять.":"还剩C1高架。到那儿他会亲自给你打电话。路窄车快——可别再晃了。",
 "Я не виляю, это…":"我不是晃，那是……",
 "Стиль. Знаю.":"风格。我知道。",
 "Это ты тот ёппарай с видео? Я Гэн.":"你就是视频里那个醉鬼？我是玄。",
 "Кольцо ты прошёл. Теперь С1 до финиша. Доедешь — завтра дуэль на Скрамбле.":"环线你过了。现在跑C1到终点。跑完——明天我们在十字路口对决。",
 "Неплохо для пьяного. Ставлю полторы тысячи. Как раз на твой взнос, да?":"对醉鬼来说还不赖。我押一千五。正好够你还款，对吧？",
 "Откуда ты знаешь про взнос?":"你怎么知道还款的事？",
 "Весь город знает. Окада болтлив. Завтра на Скрамбле. Привози свою подружку с камерой.":"全城都知道。冈田嘴不严。明天十字路口见。把你那拿相机的女朋友也带上。",
 "Я ему не подружка!":"我才不是他女朋友！",
 "Камеру взяла. Поехали — Гэн не любит ждать.":"相机带好了。走吧——玄不喜欢等人。",
 "Я тоже.":"我也不喜欢。",
 "Явился. Правила простые: 45 секунд, у кого больше очков — тот король.":"你来了。规则很简单：45秒，谁的分高谁就是王。",
 "Каждые 10 секунд Хана делает кадр. Будь рядом со мной — и кадр твой.":"花每10秒拍一张。离我近，那张照片就算你的。",
 "Без проблем.":"没问题。",
 "…Ладно. Сегодня король ты. Деньги твои. Но корону я ещё заберу.":"……好吧。今天你是王。钱归你。但王冠我会拿回来的。",
 "Миллион просмотров, Лёха! И три заказа в мастерскую. Сакура начинает себя окупать.":"一百万播放，廖哈！车库还接到三笔订单。“樱花”开始自己挣钱了。",
 "Слушай… раз уж мы в городе — отвезёшь меня к Токийской башне? Мне нужен ночной кадр.":"对了……既然我们在城里——你能载我去东京塔吗？我需要一张夜景。",
 "Корона остаётся у меня. Приходи, когда протрезвеешь.":"王冠还是我的。等你酒醒了再来。",
 "Это свидание?":"这算约会吗？",
 "Это работа. Камера у меня на коленях, так что без ударов, ёппарай.":"这是工作。相机在我腿上，所以不许撞，醉鬼。",
 "Кадр смазан. Ну… сойдёт.":"照片糊了。唉……凑合吧。",
 "Идеальный кадр. Смотри, как светится.":"完美的一张。你看它多亮。",
 "Миша показывал мне твои видео с сопок. Говорил: «Вот увидишь, он приедет».":"米沙以前常给我看你在山里的视频。他说：“你等着看吧，他会来的。”",
 "И как, оправдал?":"那我没让人失望吧？",
 "Ты… неплохой. Для пьяного.":"你……还不错。对醉鬼来说。",
 "Это было почти признание.":"这差不多算是表白了。",
 "Это было «почти». Не обольщайся. Вези меня домой.":"那是“差不多”。别多想。送我回家。",
 "Спасибо, что довёз. И… за вечер.":"谢谢你送我。还有……这个晚上。",
 "Завтра не опоздай к Окаде со взносом.":"明天别忘了按时去冈田那儿还款。",
 "Не хватает, Алексей-сан? Ничего. Я подожду. Господин Кагэяма — тоже.":"不够吗，阿列克谢先生？没关系。我会等。影山先生也会等。",
 "Подкалымлю на заездах по городу и вернусь.":"我去城里跑几单挣点钱，再回来。",
 "Две тысячи иен. Ровно. Восхитительно, Алексей-сан.":"两千日元。分毫不差。太好了，阿列克谢先生。",
 "Осталось двадцать восемь. И ещё… ваш дядя арендовал у нас ячейку.":"还剩两万八。还有一件事……您的叔叔在我们这里租了一个保险箱。",
 "Ключ он оставил не нам. Некой Рэйко Сато. Она держит раменную у перевала Акаги и, говорят, не любит гостей.":"钥匙没留在我们这里。他交给了一位叫佐藤玲子的人。她在赤城山道开拉面店，据说不喜欢访客。",
 "(достаёт фото) Акаги… Это та, с серебряными волосами?":"（拿出照片）赤城……是那个银发的人吗？",
 "Понятия не имею. Но господин Кагэяма тоже очень интересуется этой ячейкой.":"我不清楚。不过影山先生对那个保险箱也很感兴趣。",
 "Вот этого я и боялся.":"我怕的就是这个。",
 "Рэйко Сато, раменная у Акаги. Ну, поехали, дядь Миш.":"佐藤玲子，赤城的拉面店。出发吧，米沙叔叔。",
 "Ты к той, с фото? С серебряными волосами?":"要去找照片上那个？银发的那个？",
 "За ключом, Хана.":"为了钥匙，花。",
 "Ну-ну. Позвони, как вернёшься. Если вернёшься.":"行吧。回来了给我打电话。如果你还回得来的话。",
 "Закрыто.":"我们打烊了。",
 "Я Алексей. Племянник Миши. Он оставил вам ключ от своей ячейки.":"我是阿列克谢。米沙的侄子。他把储物柜的钥匙留给了你。",
 "…Так это ты. Миша просил отдать ключ, когда ты будешь готов. Ты не готов.":"……原来是你。米沙让我在你准备好的时候把钥匙给你。你还没准备好。",
 "Я видела твои видео. Ты едешь как пьяный.":"我看过你的视频。你开车像个醉鬼。",
 "Ну вот, и вы туда же.":"好嘛，你也这么说。",
 "Это хорошо. Идеальную линию противник читает за два поворота. Пьяную не прочитает никто. Осталось научить тебя не падать.":"这是好事。对手两个弯就能看穿完美的路线。醉鬼的路线谁也看不穿。我只需要教你别撞车。",
 "Три урока — и ключ твой. Первый — линия. Жду на Кольце Синдзю.":"上三节课，钥匙就是你的。第一课是路线。我在新珠环线等你。",
 "На Нака ты линию держал. Почти. Здесь кольцо шире, а я строже.":"你在中环线差点就守住了路线。这条环线更宽，而我更严格。",
 "Четыре тысячи. Смотри не на машину, а туда, где будешь через секунду.":"四千分。别盯着车，要看你下一秒会在哪儿。",
 "Линию ты держишь. Теперь научимся её терять.":"路线你守得住。现在我们来学怎么丢掉它。",
 "Второй урок — на пустой площадке в доках Харуми. Там нечего ломать, кроме тебя.":"第二课在晴海码头的空场地上。那里除了你没什么可撞坏的。",
 "Заведи машину в глубокий занос: ручник и руль до упора, чтобы её почти развернуло.":"把车甩进深度侧滑：手刹加方向打满，让它几乎打转。",
 "Как увидишь «Лови!» — лови: отпусти ручник, руль прямо, газ — и выровняй. Пять раз.":"看到“接住！”的时候就接住：松开手刹，方向回正，踩油门，把车摆正。五次。",
 "Круги нарезать не надо — считаю только пойманные. Остановишься или развернёт — не засчитаю.":"别光转圈——我只算接住的次数。停下来或者打转都不算。",
 "Вот он, твой стиль. Пьяный падает. Ты — ловишь.":"就是这个，你的风格。醉鬼摔倒，你来接住。",
 "То есть я не пьяный?":"那我不是醉鬼？",
 "Ты хуже. Ты непредсказуемый.":"你更糟。你让人捉摸不透。",
 "Последний урок — хвост. На перевале, за мной. Жду у раменной.":"最后一课是紧跟。在山道上，跟在我后面。我在拉面店等你。",
 "Держись за мной. Чем ближе — тем лучше. Но тронешь мою машину три раза — урок окончен.":"跟在我后面。越近越好。碰到我的车三次，这节课就结束。",
 "А если обгоню?":"那要是我超过你呢？",
 "Не обгонишь.":"你超不过。",
 "…Неплохо. Ты ни разу не повторил мою линию — и не отстал.":"……不错。你一次也没照抄我的路线——也一次都没掉队。",
 "Значит, ключ?":"那，钥匙呢？",
 "Значит, почти. Кстати, тебе звонит какая-то девушка. Третий раз.":"那，差不多吧。对了，有个姑娘一直在给你打电话。第三次了。",
 "Лёха! Мне нужен ночной кадр у башни, клиенты ждут. Заезжай за мной. Если наставница отпустит.":"廖哈！我需要在东京塔拍夜景，客户在等。来接我。如果你的老师肯放你走的话。",
 "Наставница, значит. С серебряными волосами.":"老师，是吧。银色头发的。",
 "Она учит меня ездить.":"她在教我开车。",
 "Ну-ну. Поехали, ученик.":"是是是。走吧，学生。",
 "Неон, башня, ты. Дай мне 800 очков заносом — и ни одного стоп-кадра со скучным лицом.":"霓虹、东京塔，还有你。给我800漂移分——别让我拍到一帧无聊的脸。",
 "Красиво… Получилось красиво.":"好美……拍得真美。",
 "Это… стоп. Кто это так светит фарами?":"这是……等等。谁在那样闪大灯？",
 "Это ты тот ёппарай, что крутится у раменной? Передай старухе: перевал теперь наш.":"你就是在拉面店附近晃悠的那个醉鬼？告诉那个老太婆：山道现在归我们了。",
 "Она не старуха.":"她才不老。",
 "Догоню — поговорим по-другому.":"等我追上你，咱们再换个方式聊。",
 "Лёха… газу!":"廖哈……快踩油门！",
 "Оторвались… Это Рин Мори. Сёстры Мори гоняют на Акаги.":"甩掉她了……那是森凛。森姐妹在赤城跑山。",
 "Говорят, им платят, чтобы Рэйко закрыла раменную.":"听说有人出钱让她们逼玲子关掉拉面店。",
 "Кто платит?":"谁出的钱？",
 "Угадай. Фамилия на «Ка». Расскажи Рэйко.":"你猜。姓氏开头是“影”。告诉玲子吧。",
 "Сидзука Мори. Рин погорячилась. Давай по-честному.":"我是森静香。凛太冲动了。我们公平地来。",
 "Побьёшь мой рекорд на Акаги — мы оставим раменную в покое. Не побьёшь — Рэйко закрывается.":"打破我在赤城的纪录，我们就不再找拉面店的麻烦。破不了，玲子就关店。",
 "Не ведись.":"别上钩。",
 "Уже повёлся.":"已经上了。",
 "…Ты проехал не так, как я считала. Ни одной одинаковой траектории.":"……你没按我算好的路线开。没有一条轨迹是一样的。",
 "Хорошо. Последний разговор — гонка. Мы с Рин против тебя. Ночью, здесь.":"好吧。最后一次较量——比赛。我和凛对你。今晚，就在这里。",
 "Перед гонкой съезди к Сэнсо-дзи. Монах кое-что хранит для тебя. Миша оставлял записки.":"比赛之前，去一趟浅草寺。僧人替你保管着东西。米沙留下了笔记。",
 "Записки… Дядь Миш, ты и тут всё продумал.":"笔记……米沙叔叔，你什么都算好了。",
 "Ты спрашивал про Кумо. Миша просил отдать это тому, кто спросит.":"你问过云山的事。米沙嘱咐我，把这个交给来问的人。",
 "«Лёха. Если читаешь, ты уже ездишь как я — то есть криво. Это хорошо.»":"“廖哈。如果你在读这封信，说明你开车已经像我一样——歪歪扭扭。这很好。”",
 "«Записок несколько. Первое правило простое: никогда не езди по чужой линии.»":"“笔记有好几张。第一条规矩很简单：永远别跑别人的路线。”",
 "«P.S. Сёстры Мори быстрые. Но Рин всегда толкается на последней шпильке. Не подставляй ей бок.»":"“附：森姐妹很快。但凛总在最后一个发夹弯挤人。别把侧面让给她。”",
 "Он знал про сестёр… Он знал, что я сюда доеду.":"他知道姐妹俩的事……他知道我会走到这一步。",
 "Ну что, ёппарай. Вдвоём на одного — честно?":"好啊，醉鬼。二对一——公平吗？",
 "Финиш — у верхней площадки. Первый доехавший забирает перевал.":"终点在山上的观景台。谁先到，山道就归谁。",
 "Пьяную линию не прочитает никто. Езжай своей.":"醉鬼的路线谁也看不穿。开你自己的。",
 "Я не смогла посчитать твою траекторию. Ни разу.":"我算不出你的轨迹。一次都没有。",
 "…Ладно. Перевал ваш. Пока.":"……好吧。山道是你的了。暂时。",
 "И ещё. У «Теней» телеметрия. Они не ездят — они повторяют. Тебя им не повторить.":"还有一件事。“影子”车队靠遥测数据开车。他们不是在开，是在复制。他们复制不了你。",
 "Держи ключ. Миша сказал бы, что ты готов. Я скажу — почти.":"钥匙给你。米沙会说你准备好了。我会说——差不多吧。",
 "Ячейка в «Сакура-Траст». И не забудь про второй взнос.":"保险箱在樱花信托。别忘了第二期还款。",
 "Перевал наш, ёппарай. Приходи ещё — посмеёмся.":"山道是我们的，醉鬼。再来吧——让我们乐一乐。",
 "Три тысячи, Алексей-сан. Не хватает? Ячейка подождёт. А господин Кагэяма — нет.":"三千，阿列克谢先生。不够？保险箱可以等。影山先生等不了。",
 "Подкалымлю на заездах и вернусь.":"我去跑几单挣点钱，再回来。",
 "Три тысячи… Вы меня удивляете, Алексей-сан. Осталось двадцать пять.":"三千……您真让我意外，阿列克谢先生。还剩两万五。",
 "Ключ? Прошу. Ячейка номер двенадцать.":"钥匙？请吧。十二号保险箱。",
 "Шлем с наклейкой «Кумо»… кассета «12 лет назад»… и фото. Человек со шрамом через всё лицо.":"一顶贴着“云山”贴纸的头盔……一盘写着“12年前”的录像带……还有一张照片。一个脸上有刀疤的男人。",
 "Я… ничего не видел, Алексей-сан. Совсем ничего.":"我……什么也没看见，阿列克谢先生。什么都没有。",
 "Лёха! Это Кир! Я в Токио — паром из Владика пришёл в порт. Встречай!":"廖哈！是我，基尔！我到东京了——从海参崴来的渡轮刚在港口靠岸。快来接我！",
 "Кир?! Вот теперь начнётся.":"基尔？！好戏开始了。",

 "Тандем с Рин под салютом":"和凛在烟花下追走",
 "Сначала мастерская. Покажу тебе Сакуру.":"先去车库。我带你看看“樱花”。",

 "Хана. Она… просто снимает.":"花。她……只是负责拍。",
 "Ага. «Просто». Поехали, водитель.":"哦。“只是”。走吧，司机。",
 "Так вот она какая, Сакура. Ты её прямо любишь, да?":"原来这就是“樱花”。你是真的很爱它吧？",
 "Добро пожаловать в Токио, да?":"欢迎来到东京，是吧？",

 "Ты пьяный, что ли? Так въезжать в мои доки.":"你喝醉了吗？这样冲进我的码头。",
 "Это стиль такой. Где детали Ханы?":"这是一种风格。花的零件在哪儿？",
 "Ни машину, ни столб, ни ящик. Тронешь — уйдёшь пешком.":"不许碰车，不许碰柱子，不许碰箱子。碰了就走路回家。",
 "Хм. Ни царапины. Держи половину.":"嗯。一点刮痕都没有。拿走一半吧。",
 "Кто тебе их заказал?":"是谁让你偷的？",
 "Одеколон. Отличная улика, Шерлок.":"古龙水。好线索啊，福尔摩斯。",
 "Задел. Вали. Приходи, когда научишься ездить.":"碰到了。滚吧。等你学会开车再来。",
 "Ванган. Едем рядом, не отставай.":"湾岸线。并排开，别掉队。",
 "Это ты не отставай.":"是你别掉队。",
 "«Тени». Сидзука про них говорила.":"“影子”。静香跟我说过他们。",
 "Кто-то знает, где ты бываешь, брат. Слишком хорошо знает.":"有人知道你会去哪儿，兄弟。知道得太清楚了。",
 "Ты меня бросил! Я чуть в отбойник не уехал.":"你把我甩下了！我差点撞上护栏。",
 "(Почему он стоит так близко к ней?)":"（他为什么站得离她这么近？）",
 "Брат, это называется ревность.":"兄弟，这叫吃醋。",
 "Неплохо. Для любителя.":"不错。对业余选手来说。",
 "Ты сегодня какой-то злой.":"你今天怎么有点凶。",
 "Я? Нормальный я.":"我？我挺正常的。",
 "Хана, моё предложение в силе. Подумай.":"花，我的提议依然有效。考虑一下。",
 "Красивый стиль. Только мимо. Хана, поедем, покажу магазин.":"风格很漂亮。可惜没打中。花，走吧，我带你去看店铺。",
 "Кто их вызвал?! Мы же только закончили!":"谁叫的警察？！我们才刚跑完！",
 "Держись крепче.":"抓紧了。",
 "Белая Сакура… Потерял. Совсем потерял. Какая жалость.":"白色樱花……跟丢了。彻底跟丢了。真可惜。",
 "Он что, нам сейчас подмигнул?":"他刚才是对我们眨眼了吗？",
 "(А Хана… после Рю почти не звонит.)":"（而花……自从龙出现后几乎不打电话了。）",
 "Ну? Кого зовёшь?":"怎么样？你约谁？",
 "Ты правда меня зовёшь? Не Рю, не камера — просто ты?":"你真的是约我？不是龙，不是镜头——就是你？",
 "Просто я.":"就是我。",
 "Смотри, начинается!":"快看，开始了！",
 "Лёха… Я отказала Рю. Магазин, спонсорство — всё.":"廖哈……我拒绝了龙。店铺、赞助——全都拒绝了。",
 "Почему?":"为什么？",
 "Он ни разу не спросил, чего хочу я. А ты спросил.":"他从来没问过我想要什么。而你问了。",
 "Хана, я…":"花，我……",

 "Пришёл всё-таки. Держись за мной. Ближе.":"你还是来了。跟在我后面。再近一点。",

 "А Рю, который крутится возле твоей Ханы, — его сын.":"而那个围着你的花转的龙——是他的儿子。",
 "Сын Кагэямы…":"影山的儿子……",
 "Красивый салют, Лёха? Я видела вас на Вангане. Вдвоём.":"烟花好看吗，廖哈？我看见你们在湾岸线上了。两个人。",

 "Курода… Ещё одно имя.":"黑田……又一个名字。",
 "Половина взноса. Совпадение?":"一半的还款。巧合吗？",
 "В этом городе — нет.":"在这座城市——不是。",
 "…и гость из «Теней» — Сэйдзи «Линия»!":"……还有来自“影子”车队的嘉宾——“线”诚二！",
 "Твоя траектория — шум. Я еду по сигналу.":"你的走线是噪音。我按信号开。",
 "А я еду по тем, кто мешает.":"而我从挡路的人身上开过去。",
 "Не тормози, ёппарай.":"别踩刹车，醉鬼。",
 "Ну… поздравляю. Ты опять король.":"嗯……恭喜。你又是王了。",
 "Гэн, ты всю гонку прикрывал этого из «Теней». Я видел.":"玄，你整场比赛都在掩护那个“影子”的人。我看见了。",
 "Что? Я… просто ехал своей линией!":"什么？我……只是在走我自己的线！",
 "Погрешность в расчётах. Пересчитаю.":"计算有误差。我会重新计算。",
 "Неплохо, ёппарай.":"不错嘛，醉鬼。",
 "Предсказуемо.":"意料之中。",
 "Корона снова моя! Ха!":"王冠又是我的了！哈！",
 "Ты обогнал меня на Вангане. В моих доках так не выйдет.":"你在湾岸线上赢了我。在我的码头可没那么容易。",
 "Понял.":"明白。",
 "…Ладно. Ты не боишься. Это я уважаю.":"……好吧。你不怕。这一点我尊重。",
 "Детали Ханы — все. И имя. Конверт мне передал Гэн.":"花的零件——全部还你。还有名字。信封是玄交给我的。",
 "Гэн?!":"玄？！",
 "И ещё. Громилу мою видел? Отдам за полцены. Заходи.":"还有。见过我的“蛮牛”吗？半价卖你。有空来。",
 "Лёха! Ты цел? Я всё видела.":"廖哈！你没事吧？我全都看到了。",
 "(целует в щёку) Это за детали. Не придумывай.":"（亲了一下他的脸颊）这是为了零件。别多想。",

 "Это за детали. Спасибо.":"这是为了零件。谢谢你。",
 "А про Рин мы ещё поговорим.":"凛的事我们以后再说。",
 "Брат, ты попал.":"兄弟，你惨了。",
 "В доках правит Бульдозер. Приходи, когда отрастишь броню.":"码头是推土机说了算。等你长出铠甲再来。",
 "Я всё исправлю. Клянусь короной.":"我会弥补的。我以王冠发誓。",
 "Корону, Гэн, не продают. Ни за деньги, ни за обещания.":"王冠是不卖的，玄。不管是为了钱，还是为了承诺。",
 "Пять тысяч. Восхитительно, Алексей-сан. Осталось двадцать.":"五千。太好了，阿列克谢先生。还剩两万。",
 "Но есть новость. Ваш долг выкуплен. Целиком.":"不过有个消息。您的债务被买下了。全部。",
 "Кем?":"被谁？",
 "Господином Кагэямой. Теперь вы должны ему.":"影山先生。现在您欠的是他。",
 "(тише) Лично я ставлю на вас, Алексей-сан. Не подведите.":"（小声）我个人押您赢，阿列克谢先生。别让我失望。",
 "Лёха, я починил видик! Кассета «12 лет назад» — смотри.":"廖哈，我修好录像机了！那盘“12年前”的录像带——快看。",
 "Перевал… ночь… и машина без фар. Совсем без света.":"山道……夜里……还有一辆不开灯的车。一点光都没有。",
 "Значит, едем на Кумо.":"那就去云山。",

 "Гонка по докам против Тэцу и трёх «Бульдозеров»: приди первым":"码头赛：对阵铁和三辆“推土机”，拿第一",
 "Обгонишь Тэцу в его доках — он отдаст все детали и назовёт имя заказчика.":"在铁的码头赢过他——他会还你所有零件，并说出幕后主使的名字。",
 "Лёха! Восемь часов на пароме, кормили одной рыбой. Обнимашки потом, сначала — где тут нормальная еда?":"廖哈！坐了八个小时渡轮，只给吃鱼。拥抱等会儿，先说——这儿哪有正经吃的？",
 "Лёха! Мою лавку обокрали! Новый турбо для Сакуры, все детали — всё увезли!":"廖哈！我的店被偷了！给“樱花”的新涡轮、所有零件——全被搬走了！",
 "Соседи видели белый фургон с бульдозером на борту — он только что свернул на вашу улицу! Перехвати!":"邻居看到一辆车身画着推土机的白色货车——它刚拐进你们那条街！拦住它！",
 "Вон он! Белый, с бульдозером! Подъедь поближе, я сниму номер.":"在那儿！白色的，画着推土机！靠近点，我来拍车牌。",
 "Есть номер! Фургон доков Харуми. Хозяин — какой-то Тэцу «Бульдозер».":"拍到车牌了！是晴海码头的货车。车主是一个叫铁“推土机”的人。",
 "Тэцу?! Его банда держит все доки. Туда просто так не заезжают.":"铁？！他的帮派控制着整个码头。那里可不是随便能开进去的。",
 "Детали теперь мои. Хочешь половину — проедь до старого крана в порту и ничего не задень.":"零件现在是我的了。想要一半——开到港口的旧吊车那里，什么都别碰到。",
 "Конверт принёс курьер. Денег много, имени нет. Только пах дорогим одеколоном. Как в Неон-тауэре.":"信封是一个快递员送来的。钱很多，没有名字。只是有股昂贵的古龙水味。就像霓虹塔里那样。",
 "Тэцу отдал мне свою старую «восемьдесят шестую». Почти без ржавчины!":"铁把他那辆旧“八六”给了我。几乎没生锈！",
 "Видел чёрную машину сзади? Всю дорогу висела. С эмблемой — тень какая-то.":"看见后面那辆黑车了吗？一路都跟着。车上有个标志——像是某种影子。",
 "Лёха, знакомься, это Рю. Он хочет спонсировать мой канал. И предлагает магазин в Неон-тауэре…":"廖哈，认识一下，这是龙。他想赞助我的频道。还要在霓虹塔给我一间店铺……",
 "Наслышан о «пьяном стиле». Хана говорит, ты лучший в городе. Проверим?":"久闻“醉拳风格”大名。花说你是全城最强的。试试看？",
 "Скрамбл, 45 секунд. Хана снимает нас обоих. Держись рядом — в кадр попадают только близкие.":"十字路口，45秒。花给我们两个拍。跟紧点——只有离我近的人才能入镜。",
 "Белая Сакура, говорит полиция Токио. Немедленно остановитесь.":"白色樱花，这里是东京警察。立即停车。",
 "(тише) Звонок был анонимный. Из автомата у Скрамбла. Береги себя, парень.":"（小声）电话是匿名的。从十字路口的公用电话打来的。保重，小子。",
 "Попался. На первый раз — штраф и лекция о вреде заносов. Езжай домой, гонщик.":"抓到了。初犯——罚款，再听一堂漂移危害讲座。回家吧，车手。",
 "Сегодня фейерверки у колеса обозрения. Весь город там будет.":"今晚摩天轮那边放烟花。全城的人都会去。",

 "…Ладно. Колесо обозрения, до главного залпа. И не тряси, я в платье.":"……好吧。摩天轮，在最后一轮大烟花之前。还有别颠，我穿着裙子。",

 "«По Харуми я гонял с Куродой. Он знает, что было на Кумо. Найдёшь его — скажи, что я не злюсь».":"“我在晴海和黑田一起跑过。他知道云山那晚发生了什么。如果你找到他——告诉他我不生气。”",
 "И ещё одно: Гэн звонил. В полночь гонка на Вангане. Пять машин, призовые — две с половиной тысячи.":"还有一件事：玄打来电话了。午夜湾岸线有比赛。五辆车，奖金两千五。",
 "Дамы и господа! Полночь, Ванган, пять машин! Король Скрамбла, Рин Мори, Тэцу «Бульдозер»…":"女士们先生们！午夜，湾岸线，五辆车！十字路口之王、森凛、铁“推土机”……",
 "Лёха, смотри за Гэном. Он сегодня какой-то слишком довольный.":"廖哈，盯着玄。他今晚高兴得有点过头了。",
 "Я и трое моих «Бульдозеров». Финиш — у старого крана. Обгонишь — отдам всё. И назову имя.":"我和我的三辆“推土机”。终点在旧吊车。赢了我——全部还你。还告诉你名字。",
 "Заманивай их в стены и контейнеры. Тэцу тяжёлый — после удара секунды три в себя приходит.":"把他们引到墙和集装箱上。铁很重——撞一下要缓三秒左右。",
 "Рю пообещал вернуть ему корону Скрамбла. И деньги. Твой король продал тебя, пьяный.":"龙答应把十字路口的王冠还给他。还有钱。你的王把你卖了，醉鬼。",
 "Пять тысяч, Алексей-сан. Не хватает? Я подожду. Но теперь ждёт не только банк.":"五千，阿列克谢先生。不够？我可以等。但现在等着的不只是银行了。",
 "Лёха, подожди! Да, это был я. Рю обещал вернуть мне Скрамбл. Я… завидовал.":"廖哈，等等！是的，是我。龙答应把十字路口还给我。我……嫉妒你。",
 "Это Кумо. Местные говорят, там до сих пор кто-то ездит в темноте.":"这是云山。当地人说，那里至今还有人在黑暗中开车。",
 "«Бульдозер» первый на финише":"一辆“推土机”先到了终点",
 "через":"途经",
 "Склад у площадки":"场地旁的仓库",
 "Южный склад":"南仓库"
};

  why:{ru:'Хана даст детали для Сакуры в долг, только если ты умеешь ездить.',en:'Hana will give you parts for Sakura on credit only if you can drive.'},
  pre:[D('hana','Ну, показывай. Зажми ручник и поверни. Без руля машина едет ровно, с рулём — сразу занос.','Go on, show me. Hold the handbrake and steer. Without steering the car goes straight, steer and it slides.'),
       D('hana','Набери 400 очков, и я поверю, что ты не просто болтаешь.','Score 400 points and I’ll believe you’re not just talking.')],
  post:[D('hana','Ладно, не врал. Виляешь ужасно, но машину держишь.','Fine, you didn’t lie. You wobble terribly, but you hold the car.'),
        D('lyokha','Это стиль.','It’s style.'),
        D('hana','Стиль… Детали я дам. Только они застряли на складе в порту, а мой фургон сломан.','Style… I’ll give you the parts. Only they’re stuck at the port warehouse, and my van is broken.'),
        D('hana','Съезди за коробкой. Она хрупкая — там стёкла фар и датчики.','Go get the box. It’s fragile — headlight glass and sensors.')]},
 {id:'k3',title:{ru:'Хрупкий груз',en:'Fragile cargo'},at:'hana',type:'deliv',stops:['port','garage'],fragile:true,reward:200,
  goal:{ru:'Забери детали в порту и довези до мастерской без ударов',en:'Pick up the parts at the port and bring them to the garage without hits'},
  why:{ru:'Новые детали для Сакуры. Хана поставит их прямо в мастерской.',en:'New parts for Sakura. Hana will fit them right in the garage.'},
  pre:[D('hana','Коробка ждёт на складе в порту, на моё имя. Мой фургон сломан — поеду с тобой.','The box is waiting at the port warehouse, under my name. My van is broken — I’m coming with you.'),
       D('hana','Заберём — и сразу в мастерскую, там и поставлю. Каждый удар — минус из твоей платы.','We pick it up and go straight to the garage, I’ll fit them there. Every hit comes out of your pay.'),
       D('lyokha','А если совсем без ударов?','And if there are no hits at all?'),D('hana','Тогда я, так и быть, удивлюсь.','Then I might actually be impressed.')],
  stopLines:{port:[D('docker','Коробка для Ханы? Раньше за ней Миша сам приезжал. Каждый месяц, как часы.','A box for Hana? Misha used to come for it himself. Every month, like clockwork.'),
                   D('docker','Говорил, однажды соберёт Сакуру и снова поедет на Кумо. Держи. И не гони, там стекло.','He said one day he’d rebuild Sakura and drive Kumo again. Here. And don’t rush, there’s glass inside.'),
                   D('hana','Кумо?.. Он мне про него никогда не рассказывал. Поехали в мастерскую.','Kumo?.. He never told me about it. Let’s go to the garage.')]},
  work:{ru:'Хана ставит детали…',en:'Hana is fitting the parts…'},
  post:function(r){return(r.hits?[D('hana','Ну… половина стёкол жива. Остальное докуплю.','Well… half the glass survived. I’ll buy the rest.')]:[D('hana','Ни царапины. Беру тебя в курьеры.','Not a scratch. You’re hired as my courier.')]).concat([
   D('hana','Готово. Заводи.','Done. Start her up.'),
   D('lyokha','…Не стучит. Сакура задышала!','…No knocking. Sakura is breathing!'),
   D('hana','Ещё бы. Кстати, бабушка Тоё звонила мне три раза: «Где мальчик?» Она тридцать лет кормила Мишу. Заедь к ней, ларёк у пагоды.','Of course. By the way, grandma Toyo called me three times: “Where’s the boy?” She fed Misha for thirty years. Go see her, the stall by the pagoda.')])}},
 {id:'k4',title:{ru:'Маршрут Миши',en:'Misha’s route'},at:'toyo',type:'deliv',stops:['castle','wheel','sensoji','toyo'],limit:170,limitN:3,reward:150,
  goal:{ru:'Развези онигири: замок, колесо обозрения, Сэнсо-дзи — и назад к Тоё',en:'Deliver onigiri: castle, Ferris wheel, Senso-ji — then back to Toyo'},
  why:{ru:'Каждое утро Миша развозил онигири Тоё. Эти люди ещё не знают, что его нет.',en:'Every morning Misha delivered Toyo’s onigiri. These people don’t know he’s gone yet.'},
  pre:[D('toyo','Пришёл всё-таки. Садись, слушай.','You came after all. Sit down and listen.'),
       D('toyo','Тридцать лет Миша каждое утро развозил мои онигири: охраннику у замка, смотрителю колеса и монаху в Сэнсо-дзи.','For thirty years Misha delivered my onigiri every morning: to the castle guard, the Ferris wheel keeper and the monk at Senso-ji.'),
       D('toyo','Они до сих пор ждут. Никто им не сказал. Я не смогла.','They’re still waiting. Nobody told them. I couldn’t.'),
       D('lyokha','Хочешь, чтобы сказал я?','You want me to tell them?'),
       D('toyo','Хочу, чтобы ты довёз их горячими. Уложись в три минуты! А потом возвращайся — расскажешь, что они сказали.','I want them delivered hot. Make it in under three minutes! Then come back and tell me what they said.'),
       D('toyo','На карте можно ставить метки — она сама покажет дорогу.','You can put markers on the map — it shows the way.')],
  stopLines:{castle:[D('guard','Онигири? А где Миша?.. Вот как.','Onigiri? Where’s Misha?.. I see.'),
                     D('guard','Он всегда влетал во двор боком. Говорил, лучше этого поворота в городе нет. Разве что на Кумо.','He always slid into the yard sideways. Said there was no better corner in the city. Except on Kumo.')],
             wheel:[D('keeper','Ты на него похож. Он здесь катался последний раз лет двенадцать назад.','You look like him. The last time he rode here was about twelve years ago.'),
                    D('keeper','С девушкой. Волосы серебряные, а сама молодая. Больше я её не видел. Да и его — таким счастливым.','With a girl. Silver hair, yet so young. I never saw her again. Nor him that happy.'),
                    D('lyokha','Серебряные…','Silver…',LYO_T)],
             sensoji:[D('monk','Значит, Миша ушёл. Каждый месяц он ставил здесь свечу.','So Misha is gone. Every month he lit a candle here.'),
                      D('monk','Всегда с одними словами: «За ту ночь на Кумо». Что это значит, он не говорил.','Always with the same words: “For that night on Kumo.” He never said what it meant.'),
                      D('lyokha','Онигири развёз. Теперь назад к Тоё.','Onigiri delivered. Now back to Toyo.',LYO_T)]},
  post:[D('toyo','Вернулся. Горячими довёз? Миша возил так же. Только он ещё и пел.','You’re back. Were they hot? Misha drove just like that. Only he sang too.'),
        D('lyokha','Тоё-сан, смотритель колеса видел Мишу с девушкой. Волосы серебряные. А монах говорит про какую-то «ночь на Кумо».','Toyo-san, the wheel keeper saw Misha with a girl. Silver hair. And the monk talks about some “night on Kumo”.'),
        D('toyo','…Значит, пора. Миша оставил для тебя вот это.','…Then it’s time. Misha left this for you.'),
        D('lyokha','Фото. Дядя молодой… и она. Горы, перевал Акаги. На обороте: «Спроси у перевала».','A photo. Young uncle… and her. Mountains, the Akagi pass. On the back: “Ask the pass.”',LYO_T),
        D('toyo','А теперь о плохом. Приходил Окада из банка, искал тебя. Мастерская заложена. Езжай в банк у Скайтри, пока он не пришёл сам.','Now the bad news. Okada from the bank came looking for you. The garage is mortgaged. Go to the bank by the Skytree before he comes himself.')]},
 {id:'k6',title:{ru:'Господин Окада',en:'Mr. Okada'},at:'bank',type:'scene',reward:0,
  goal:{ru:'Приезжай в банк у Скайтри',en:'Come to the bank by the Skytree'},
  why:{ru:'Окада из банка искал тебя. Мастерская заложена.',en:'Okada from the bank was looking for you. The garage is mortgaged.'},
  pre:[D('okada','Алексей-сан? Проходите. Окада, банк «Сакура-Траст». Примите мои соболезнования.','Alexei-san? Please come in. Okada, Sakura Trust bank. My condolences.'),
       D('okada','Ваш дядя заложил мастерскую. Долг — тридцать тысяч иен. Первый взнос, две тысячи, — до конца месяца.','Your uncle mortgaged the garage. The debt is thirty thousand yen. The first payment, two thousand, is due by the end of the month.'),
       D('lyokha','А если не внесу?','And if I don’t pay?'),
       D('okada','Мастерскую продадут. Покупатель уже есть — господин Кагэяма. Очень щедрый человек. И очень терпеливый.','The garage will be sold. There’s already a buyer — Mr. Kageyama. A very generous man. And very patient.'),
       D('okada','Но я очень, очень на вас надеюсь.','But I am very, very hopeful about you.'),
       D('lyokha','(выйдя из банка) Хана, где за месяц взять две тысячи?','(outside the bank) Hana, where do I find two thousand in a month?'),
       D('hana','На Скрамбле. Там толпа и камеры. Покажешь заносы — я сниму, просмотры приведут клиентов в мастерскую.','At the Scramble. Crowds and cameras. Show them your drifts — I’ll film, and the views will bring customers to the garage.',PH_H),
       D('hana','Заезжай за мной в лавку, камеру возьму.','Pick me up at the shop, I’ll bring the camera.',PH_H)],
  post:[]},
 {id:'k5',title:{ru:'Ёппарай',en:'Yopparai'},at:'hana',ride:'scramble',rideZone:'scr',type:'drift',goalPts:600,radius:420,dc:'scramble',reward:200,
  goal:{ru:'Отвези Хану на Скрамбл и набери там 600 очков заносом',en:'Drive Hana to the Scramble and score 600 drift points there'},
  why:{ru:'Хана снимает: просмотры — это клиенты, а клиенты — деньги на взнос.',en:'Hana is filming: views mean customers, and customers mean money for the payment.'},
  pre:[D('hana','Камеру взяла. Поехали на Скрамбл — главный перекрёсток города, там тебя увидят все.','Got the camera. Let’s go to the Scramble — the city’s main crossing, everyone will see you there.')],
  arrive:[D('hana','Приехали. Толпа, камеры, неон. Набери 600 очков заносом — я снимаю.','We’re here. Crowds, cameras, neon. Score 600 drift points — I’m filming.')],
  post:[D('hana','Ты это специально так виляешь?','Do you wobble like that on purpose?'),D('lyokha','Конечно. Это стиль.','Of course. It’s style.'),
        D('hana','Тогда у стиля уже есть имя. Весь Скрамбл зовёт тебя «ёппарай». Пьяный.','Then the style already has a name. The whole Scramble calls you “yopparai”. Drunk.'),
        D('lyokha','Да я трезвый, как стекло!','I’m sober as glass!'),
        D('hana','Им это не объяснишь. Сорок тысяч просмотров за час. И смотри, кто написал под видео.','Try telling them that. Forty thousand views in an hour. And look who commented.'),
        D('gen','«Виляет как пьяный. Пройдёт Кольцо Нака по линии и Эстакаду С1 — тогда поговорим. Гэн»','“Wobbles like a drunk. If he rides the Naka Ring on the line and the C1 Expressway — then we’ll talk. Gen”',GEN_C),
        D('lyokha','Кто такой Гэн?','Who’s Gen?'),
        D('hana','Король Скрамбла. Кого он признаёт, к тому очередь клиентов. Нам это нужно, Лёха.','King of the Scramble. Whoever he respects gets a queue of customers. We need that, Lyokha.'),
        D('hana','Я на метро — монтировать. Соберёшься на Нака — заезжай за мной, сниму для Гэна.','I’ll take the metro and edit. When you’re ready for Naka, pick me up — I’ll film it for Gen.')]},
 {id:'k7',title:{ru:'Розовая линия',en:'The pink line'},at:'hana',ride:'naka',type:'zone',zone:'r2',goalPts:3000,reward:250,
  goal:{ru:'Отвези Хану на Кольцо Нака: держись линии, набери 3 000',en:'Drive Hana to the Naka Ring: follow the line, score 3,000'},
  why:{ru:'Первое испытание Гэна. Хана снимет, Гэн посмотрит запись.',en:'Gen’s first test. Hana films, Gen watches the recording.'},
  pre:[D('hana','Едем на Кольцо Нака. Гэн будет смотреть запись, так что без позора.','We’re going to the Naka Ring. Gen will watch the recording, so don’t embarrass us.')],
  arrive:[D('hana','На кольцах считают не занос, а линию. Видишь розовую траекторию? Чем ближе к ней, тем больше очков.','On the rings they don’t score the drift, they score the line. See the pink path? The closer you stay, the more points.'),
          D('hana','По часовой. Против хода — ноль. Камера пишет.','Clockwise. The wrong way gives zero. Camera’s rolling.')],
  post:[D('hana','Чисто. Почти. Отправила Гэну — уже лайкнул.','Clean. Almost. Sent it to Gen — he already liked it.'),
        D('hana','Осталась Эстакада С1. Туда он тебя позовёт сам. Там узко и быстро — не вздумай вилять.','The C1 Expressway is left. He’ll call you there himself. It’s narrow and fast — don’t you dare wobble.'),
        D('lyokha','Я не виляю, это…','I don’t wobble, it’s…'),D('hana','Стиль. Знаю.','Style. I know.')]},
 {id:'k8',title:{ru:'Король вызывает',en:'The King calls'},at:'c1',type:'zone',zone:'c1',course:true,reward:300,
  goal:{ru:'Проедь Эстакаду С1 до финиша',en:'Drive the C1 Expressway to the finish'},
  why:{ru:'Второе испытание Гэна. После него он с тобой заговорит.',en:'Gen’s second test. After it he’ll talk to you.'},
  pre:[D('gen','Это ты тот ёппарай с видео? Я Гэн.','You’re that yopparai from the video? I’m Gen.'),
       D('gen','Кольцо ты прошёл. Теперь С1 до финиша. Доедешь — завтра дуэль на Скрамбле.','You passed the ring. Now the C1 to the finish. Make it — and tomorrow we duel at the Scramble.')],
  post:[D('gen','Неплохо для пьяного. Ставлю полторы тысячи. Как раз на твой взнос, да?','Not bad for a drunk. I’m betting fifteen hundred. Just right for your payment, huh?'),
        D('lyokha','Откуда ты знаешь про взнос?','How do you know about the payment?'),
        D('gen','Весь город знает. Окада болтлив. Завтра на Скрамбле. Привози свою подружку с камерой.','The whole city knows. Okada talks. Tomorrow at the Scramble. Bring your girlfriend with the camera.'),
        D('hana','Я ему не подружка!','I’m not his girlfriend!')]},
 {id:'k9',title:{ru:'Король Скрамбла',en:'King of the Scramble'},at:'hana',ride:'scramble',type:'duel',zone:'scr',boss:'gen',reward:1500,
  goal:{ru:'Привези Хану на Скрамбл и обыграй Гэна за 45 секунд',en:'Bring Hana to the Scramble and outscore Gen in 45 seconds'},
  why:{ru:'Выигрыш закроет взнос, а победа над Гэном приведёт клиентов.',en:'The prize covers the payment, and beating Gen brings customers.'},
  pre:[D('hana','Камеру взяла. Поехали — Гэн не любит ждать.','Got the camera. Let’s go — Gen doesn’t like waiting.'),D('lyokha','Я тоже.','Neither do I.')],
  arrive:[D('gen','Явился. Правила простые: 45 секунд, у кого больше очков — тот король.','You showed up. Simple rules: 45 seconds, whoever scores more is king.'),
          D('gen','Каждые 10 секунд Хана делает кадр. Будь рядом со мной — и кадр твой.','Every 10 seconds Hana takes a shot. Be close to me and the shot is yours.'),
          D('lyokha','Без проблем.','No problem.')],
  post:[D('gen','…Ладно. Сегодня король ты. Деньги твои. Но корону я ещё заберу.','…Fine. Today you’re king. The money is yours. But I’ll take the crown back.'),
        D('hana','Миллион просмотров, Лёха! И три заказа в мастерскую. Сакура начинает себя окупать.','A million views, Lyokha! And three orders for the garage. Sakura is starting to pay for herself.'),
        D('hana','Слушай… раз уж мы в городе — отвезёшь меня к Токийской башне? Мне нужен ночной кадр.','Listen… since we’re in town — will you drive me to Tokyo Tower? I need a night shot.')],
  fail:[D('gen','Корона остаётся у меня. Приходи, когда протрезвеешь.','The crown stays with me. Come back when you sober up.')]},
 {id:'k9b',title:{ru:'Вечер у башни',en:'Evening at the Tower'},at:'scramble',auto:true,type:'deliv',stops:['tower','hana'],fragile:true,fragileFrom:0,reward:100,
  goal:{ru:'Отвези Хану к Токийской башне, потом домой. Камера у неё на коленях — без ударов',en:'Drive Hana to Tokyo Tower, then home. The camera is on her lap — no hits'},
  why:{ru:'Хана просила ночной кадр башни. Ну и… просто побыть вдвоём.',en:'Hana asked for a night shot of the Tower. And… just some time together.'},
  pre:[D('lyokha','Это свидание?','Is this a date?'),
       D('hana','Это работа. Камера у меня на коленях, так что без ударов, ёппарай.','It’s work. The camera is on my lap, so no hits, yopparai.')],
  stopLines:{tower:function(r){var a=r.hits?[D('hana','Кадр смазан. Ну… сойдёт.','The shot is blurry. Well… it’ll do.')]:[D('hana','Идеальный кадр. Смотри, как светится.','A perfect shot. Look how it glows.')];
   return a.concat([D('hana','Миша показывал мне твои видео с сопок. Говорил: «Вот увидишь, он приедет».','Misha used to show me your videos from the hills. He said: “You’ll see, he’ll come.”'),
    D('lyokha','И как, оправдал?','So, did I live up to it?'),D('hana','Ты… неплохой. Для пьяного.','You’re… not bad. For a drunk.'),
    D('lyokha','Это было почти признание.','That was almost a confession.'),D('hana','Это было «почти». Не обольщайся. Вези меня домой.','That was an “almost”. Don’t get ideas. Drive me home.')])}},
  post:[D('hana','Спасибо, что довёз. И… за вечер.','Thanks for the ride. And… for the evening.'),
        D('hana','Завтра не опоздай к Окаде со взносом.','Don’t be late to Okada with the payment tomorrow.')]},
 {id:'k10',title:{ru:'Первый взнос',en:'First payment'},at:'bank',type:'pay',amount:2000,reward:0,
  goal:{ru:'Внеси первый взнос — 2 000 ¥',en:'Make the first payment — 2,000 ¥'},
  why:{ru:'Не внесёшь — мастерская Миши уйдёт Кагэяме.',en:'Miss it and Misha’s garage goes to Kageyama.'},
  short:[D('okada','Не хватает, Алексей-сан? Ничего. Я подожду. Господин Кагэяма — тоже.','Not enough, Alexei-san? That’s fine. I’ll wait. So will Mr. Kageyama.'),
         D('lyokha','Подкалымлю на заездах по городу и вернусь.','I’ll earn a bit on the city runs and come back.',LYO_T)],
  pre:[D('okada','Две тысячи иен. Ровно. Восхитительно, Алексей-сан.','Two thousand yen. Exactly. Delightful, Alexei-san.'),
       D('okada','Осталось двадцать восемь. И ещё… ваш дядя арендовал у нас ячейку.','Twenty-eight left. And one more thing… your uncle rented a safe-deposit box with us.'),
       D('okada','Ключ он оставил не нам. Некой Рэйко Сато. Она держит раменную у перевала Акаги и, говорят, не любит гостей.','He didn’t leave the key with us. He left it with a certain Reiko Sato. She runs a ramen shop at the Akagi pass and, they say, dislikes visitors.'),
       D('lyokha','(достаёт фото) Акаги… Это та, с серебряными волосами?','(takes out the photo) Akagi… Is that the silver-haired one?'),
       D('okada','Понятия не имею. Но господин Кагэяма тоже очень интересуется этой ячейкой.','I have no idea. But Mr. Kageyama is also very interested in that box.'),
       D('lyokha','Вот этого я и боялся.','That’s exactly what I was afraid of.')],
  post:[], chapterEnd:1, next:{ru:'Найди Рэйко у перевала Акаги',en:'Find Reiko at the Akagi pass'}}
];

 {id:'c1',ch:2,title:{ru:'Раменная у перевала',en:'Ramen at the pass'},at:'bank',auto:true,type:'deliv',stops:['ramen'],reward:300,

CHAP[3]={t:{ru:'Огни Харуми',en:'Harumi Lights'},tod:{ru:'ночь · порт',en:'night · the port'},goal:{ru:'Вернуть детали Ханы, узнать, кто сливает тебя «Теням», и внести третий взнос',en:'Get Hana’s parts back, find out who leaks your moves to the Shadows, and make the third payment'},pay:5000};
CHAP[4]={t:{ru:'Призрак',en:'The Ghost'},tod:{ru:'глубокая ночь · перевал Кумо',en:'deep night · Kumo pass'}};
var PH_W=['Ватанабэ · по рации','Watanabe · on the radio'],PH_R=['Рин · по телефону','Rin · on the phone'],PH_T3=['Тэцу · по телефону','Tetsu · on the phone'],PH_S=['Сидзука · по телефону','Shizuka · on the phone'];
STORY.push(
 {id:'d1',ch:3,title:{ru:'Паром из Владика',en:'The ferry from Vladik'},at:'port',type:'deliv',stops:['garage'],reward:200,
  goal:{ru:'Встреть Кира в порту и отвези в мастерскую',en:'Meet Kir at the port and take him to the garage'},
  why:{ru:'Кир приплыл из Владивостока. Лучший друг — и худший штурман.',en:'Kir came over from Vladivostok. Best friend, worst navigator.'},
  pre:[D('kir','Лёха! Восемь часов на пароме, кормили одной рыбой. Обнимашки потом, сначала — где тут нормальная еда?','Lyokha! Eight hours on a ferry and nothing but fish. Hugs later — where’s some real food around here?'),
       D('lyokha','Сначала мастерская. Покажу тебе Сакуру.','Garage first. I’ll show you Sakura.'),
       D('kir','Та самая из твоих видео? А девушка из видео где?','The one from your videos? And where’s the girl from the videos?'),
       D('lyokha','Хана. Она… просто снимает.','Hana. She… just films.'),
       D('kir','Ага. «Просто». Поехали, водитель.','Sure. “Just”. Let’s go, driver.')],
  post:[D('kir','Так вот она какая, Сакура. Ты её прямо любишь, да?','So this is Sakura. You really love her, huh?'),
        D('hana','Лёха! Мою лавку обокрали! Новый турбо для Сакуры, все детали — всё увезли!','Lyokha! My shop was robbed! The new turbo for Sakura, all the parts — gone!',PH_H),
        D('hana','Соседи видели белый фургон с бульдозером на борту — он только что свернул на вашу улицу! Перехвати!','The neighbours saw a white van with a bulldozer on the side — it just turned onto your street! Cut it off!',PH_H),
        D('kir','Добро пожаловать в Токио, да?','Welcome to Tokyo, huh?')]},
 {id:'d2',ch:3,title:{ru:'Фургон',en:'The van'},at:'garage',auto:true,type:'pursuit',via:['hana'],dest:'pad',loop:['port','yd2','yd1','pad'],need:10,limit:80,reward:400,
  goal:{ru:'Догони фургон и держись рядом 10 секунд — Кир снимет номер',en:'Catch the van and stay close for 10 seconds — Kir will film the plate'},
  why:{ru:'Фургон с деталями Ханы уходит к докам.',en:'The van with Hana’s parts is heading for the docks.'},
  pre:[D('kir','Вон он! Белый, с бульдозером! Подъедь поближе, я сниму номер.','There it is! White, with a bulldozer! Get closer, I’ll film the plate.'),
       D('lyokha','Держись за что-нибудь.','Hold on to something.')],
  post:[D('kir','Есть номер! Фургон доков Харуми. Хозяин — какой-то Тэцу «Бульдозер».','Got the plate! A Harumi docks van. The owner is some Tetsu “Bulldozer”.'),
        D('hana','Тэцу?! Его банда держит все доки. Туда просто так не заезжают.','Tetsu?! His gang runs all the docks. Nobody just drives in there.',PH_H),
        D('lyokha','Значит, заедем не просто так.','Then we won’t “just” drive in.')],
  fail:[D('kir','Ушёл… Давай ещё раз. Я в этот раз не буду жевать.','It got away… Let’s go again. I won’t be chewing this time.')],timeout:'фургон ушёл в доки'},
 {id:'d3',ch:3,title:{ru:'Без царапин',en:'Not a scratch'},at:'pad',type:'deliv',stops:['crane'],clean:1,limit:70,reward:450,
  goal:{ru:'Проедь доки до старого крана и ничего не задень',en:'Drive through the docks to the old crane without touching anything'},
  why:{ru:'Тэцу отдаст половину деталей, если ты проедешь его доки без единой царапины.',en:'Tetsu will give back half the parts if you get through his docks without a scratch.'},
  pre:[D('tetsu','Ты пьяный, что ли? Так въезжать в мои доки.','Are you drunk? Driving into my docks like that.'),
       D('lyokha','Это стиль такой. Где детали Ханы?','It’s a style. Where are Hana’s parts?'),
       D('tetsu','Детали теперь мои. Хочешь половину — проедь до старого крана в порту и ничего не задень.','The parts are mine now. Want half? Drive to the old crane at the port and don’t touch a thing.'),
       D('tetsu','Ни машину, ни столб, ни ящик. Тронешь — уйдёшь пешком.','Not a car, not a pole, not a crate. Touch anything and you walk home.')],
  post:[D('tetsu','Хм. Ни царапины. Держи половину.','Hm. Not a scratch. Here’s half.'),
        D('lyokha','Кто тебе их заказал?','Who ordered them?'),
        D('tetsu','Конверт принёс курьер. Денег много, имени нет. Только пах дорогим одеколоном. Как в Неон-тауэре.','A courier brought an envelope. Lots of money, no name. It just smelled of expensive cologne. Like in Neon Tower.'),
        D('kir','Одеколон. Отличная улика, Шерлок.','Cologne. Great clue, Sherlock.')],
  fail:[D('tetsu','Задел. Вали. Приходи, когда научишься ездить.','You touched it. Get lost. Come back when you can drive.')]},
 {id:'d4',ch:3,title:{ru:'Двое на Вангане',en:'Two on the Wangan'},at:'wgs',type:'coop',zone:'wg',reward:450,
  goal:{ru:'Проедь Ванган вместе с Киром: финишируйте с разницей не больше 10 секунд',en:'Drive the Wangan with Kir: finish no more than 10 seconds apart'},
  why:{ru:'Тэцу продал Киру старую «восемьдесят шестую». Пора показать ему ночной Токио.',en:'Tetsu sold Kir an old “eighty-six”. Time to show him Tokyo at night.'},
  pre:[D('kir','Тэцу отдал мне свою старую «восемьдесят шестую». Почти без ржавчины!','Tetsu let me have his old “eighty-six”. Hardly any rust!'),
       D('lyokha','Ванган. Едем рядом, не отставай.','The Wangan. We ride together, keep up.'),
       D('kir','Это ты не отставай.','You keep up.')],
  post:[D('kir','Видел чёрную машину сзади? Всю дорогу висела. С эмблемой — тень какая-то.','Did you see the black car behind us? It hung there the whole way. With a logo — some kind of shadow.'),
        D('lyokha','«Тени». Сидзука про них говорила.','The Shadows. Shizuka told me about them.'),
        D('kir','Кто-то знает, где ты бываешь, брат. Слишком хорошо знает.','Someone knows where you go, bro. Knows it too well.')],
  fail:[D('kir','Ты меня бросил! Я чуть в отбойник не уехал.','You ditched me! I nearly went into the barrier.')]},
 {id:'d5',ch:3,title:{ru:'Незнакомец',en:'The stranger'},at:'scramble',type:'duel',zone:'scr',rival:'ryu',rate:1.15,reward:500,
  goal:{ru:'Набери на Скрамбле больше очков, чем Рю, за 45 секунд',en:'Outscore Ryu at the Scramble in 45 seconds'},
  why:{ru:'Возле Ханы появился Рю. Красивый, богатый — и всё время рядом с ней.',en:'Ryu has turned up next to Hana. Handsome, rich — and always close to her.'},
  pre:[D('hana','Лёха, знакомься, это Рю. Он хочет спонсировать мой канал. И предлагает магазин в Неон-тауэре…','Lyokha, meet Ryu. He wants to sponsor my channel. And he’s offering me a shop in Neon Tower…'),
       D('ryu','Наслышан о «пьяном стиле». Хана говорит, ты лучший в городе. Проверим?','I’ve heard about the “drunken style”. Hana says you’re the best in town. Shall we check?'),
       D('lyokha','(Почему он стоит так близко к ней?)','(Why is he standing so close to her?)',LYO_T),
       D('kir','Брат, это называется ревность.','Bro, that’s called jealousy.'),
       D('ryu','Скрамбл, 45 секунд. Хана снимает нас обоих. Держись рядом — в кадр попадают только близкие.','The Scramble, 45 seconds. Hana films us both. Stay close — only those near me get in the shot.')],
  post:[D('ryu','Неплохо. Для любителя.','Not bad. For an amateur.'),
        D('hana','Ты сегодня какой-то злой.','You’re kind of angry today.'),
        D('lyokha','Я? Нормальный я.','Me? I’m fine.'),
        D('ryu','Хана, моё предложение в силе. Подумай.','Hana, my offer stands. Think about it.')],
  fail:[D('ryu','Красивый стиль. Только мимо. Хана, поедем, покажу магазин.','A pretty style. Just off target. Hana, come on, I’ll show you the shop.')]},
 {id:'d6',ch:3,title:{ru:'Анонимный звонок',en:'An anonymous call'},at:'scramble',auto:true,type:'police',limit:60,reward:400,
  goal:{ru:'Уйди от полиции: оторвись или скройся у неё из виду',en:'Lose the police: get away or get out of their sight'},
  why:{ru:'Кто-то вызвал полицию прямо на заезд.',en:'Someone called the police right onto the run.'},
  pre:[D('watanabe','Белая Сакура, говорит полиция Токио. Немедленно остановитесь.','White Sakura, this is the Tokyo police. Stop immediately.',PH_W),
       D('kir','Кто их вызвал?! Мы же только закончили!','Who called them?! We just finished!'),
       D('lyokha','Держись крепче.','Hold on tight.')],
  post:[D('watanabe','Белая Сакура… Потерял. Совсем потерял. Какая жалость.','White Sakura… Lost him. Completely lost him. What a pity.',PH_W),
        D('watanabe','(тише) Звонок был анонимный. Из автомата у Скрамбла. Береги себя, парень.','(quieter) The call was anonymous. From a payphone at the Scramble. Take care, kid.',PH_W),
        D('kir','Он что, нам сейчас подмигнул?','Did he just wink at us?')],
  fail:[D('watanabe','Попался. На первый раз — штраф и лекция о вреде заносов. Езжай домой, гонщик.','Gotcha. First time: a fine and a lecture on the dangers of drifting. Go home, racer.')]},
 {id:'d7',ch:3,title:{ru:'Ночь фейерверков',en:'Fireworks night'},at:'garage',type:'choice',reward:0,
  goal:{ru:'Выбери, с кем провести ночь фейерверков',en:'Choose who to spend fireworks night with'},
  why:{ru:'У колеса обозрения фестиваль. Хана молчит с того вечера. А Рин звонит уже третий раз.',en:'There’s a festival at the Ferris wheel. Hana has been quiet since that evening. And Rin has called three times.'},
  pre:[D('kir','Сегодня фейерверки у колеса обозрения. Весь город там будет.','Fireworks at the Ferris wheel tonight. The whole city will be there.'),
       D('rin','Ёппарай. Ночной тандем по Вангану под салютом. Дважды не зову.','Yopparai. A night tandem on the Wangan under the fireworks. I don’t ask twice.',PH_R),
       D('lyokha','(А Хана… после Рю почти не звонит.)','(And Hana… she’s barely called since Ryu.)',LYO_T),
       D('kir','Ну? Кого зовёшь?','So? Who are you asking?')],
  choices:[{v:'hana',ru:'Позвать Хану на колесо обозрения',en:'Take Hana to the Ferris wheel'},{v:'rin',ru:'Тандем с Рин под салютом',en:'Tandem with Rin under the fireworks'}],post:[]},
 {id:'d7h',ch:3,only:'hana',title:{ru:'Колесо обозрения',en:'The Ferris wheel'},at:'hana',type:'deliv',stops:['wheel'],clean:3,limit:60,fw:1,reward:300,
  goal:{ru:'Довези Хану до колеса обозрения до главного залпа. Три удара — и она выйдет',en:'Get Hana to the Ferris wheel before the big finale. Three hits and she gets out'},
  why:{ru:'Ты позвал Хану. Не опоздай — и не тряси, она в платье.',en:'You asked Hana. Don’t be late — and no shaking, she’s in a dress.'},
  pre:[D('hana','Ты правда меня зовёшь? Не Рю, не камера — просто ты?','You’re really asking me? Not Ryu, not the camera — just you?'),
       D('lyokha','Просто я.','Just me.'),
       D('hana','…Ладно. Колесо обозрения, до главного залпа. И не тряси, я в платье.','…Fine. The Ferris wheel, before the big finale. And no shaking, I’m in a dress.')],
  post:[D('hana','Смотри, начинается!','Look, it’s starting!'),
        D('hana','Лёха… Я отказала Рю. Магазин, спонсорство — всё.','Lyokha… I turned Ryu down. The shop, the sponsorship — all of it.'),
        D('lyokha','Почему?','Why?'),
        D('hana','Он ни разу не спросил, чего хочу я. А ты спросил.','He never once asked what I want. You did.'),
        D('lyokha','Хана, я…','Hana, I…'),
        D('hana','Тихо. Салют пропустишь.','Shh. You’ll miss the fireworks.'),
        D('shizuka','Алексей, это Сидзука. Рю — сын Кагэямы. Подумала, тебе стоит знать.','Alexei, it’s Shizuka. Ryu is Kageyama’s son. I thought you should know.',PH_S),
        D('hana','Сын Кагэямы?.. Так вот зачем ему мой магазин рядом с твоей мастерской.','Kageyama’s son?.. So that’s why he wanted my shop next to your garage.')],
  fail:[D('hana','Ай! Всё, я выхожу. Салют посмотрю с берега. Одна.','Ow! That’s it, I’m getting out. I’ll watch the fireworks from the shore. Alone.')]},
 {id:'d7r',ch:3,only:'rin',title:{ru:'Тандем под салютом',en:'Tandem under the fireworks'},at:'wgs',type:'tandem',zone:'wg',leader:'rin',fw:1,reward:300,
  goal:{ru:'Держись за Рин на Вангане под фейерверками',en:'Stay on Rin’s tail on the Wangan under the fireworks'},
  why:{ru:'Рин позвала на ночной тандем. Отказывать ей опасно.',en:'Rin asked you to a night tandem. Saying no to her is dangerous.'},
  pre:[D('rin','Пришёл всё-таки. Держись за мной. Ближе.','You came after all. Stay behind me. Closer.'),
       D('lyokha','Ты всегда так зовёшь на свидание?','Is this how you always ask someone out?'),
       D('rin','Это не свидание. Это тандем.','It’s not a date. It’s a tandem.')],
  post:[D('rin','…Ты хорошо держишься. Слушай. Нас с сестрой нанимал Кагэяма. Чтобы выжить Рэйко с перевала.','…You hold on well. Listen. Kageyama hired my sister and me. To push Reiko off the pass.'),
        D('rin','А Рю, который крутится возле твоей Ханы, — его сын.','And Ryu, the one hanging around your Hana, is his son.'),
        D('lyokha','Сын Кагэямы…','Kageyama’s son…'),
        D('hana','Красивый салют, Лёха? Я видела вас на Вангане. Вдвоём.','Pretty fireworks, Lyokha? I saw you two on the Wangan. Together.',PH_H),
        D('lyokha','Хана, это не то, что…','Hana, it’s not what…'),
        D('hana','Мне всё равно. Правда.','I don’t care. Really.',PH_H)],
  fail:[D('rin','Отстал. Скучно с тобой, ёппарай.','You fell behind. You’re boring, yopparai.')]},
 {id:'d8',ch:3,title:{ru:'Записка №2',en:'Note #2'},at:'port',type:'deliv',stops:['crane'],reward:0,
  goal:{ru:'Найди тайник Миши под старым краном в порту',en:'Find Misha’s stash under the old crane at the port'},
  why:{ru:'Тэцу вспомнил: двенадцать лет назад Миша что-то прятал под старым краном.',en:'Tetsu remembered: twelve years ago Misha hid something under the old crane.'},
  pre:[D('tetsu','Эй, пьяный. Твой дядя тут гонял лет двенадцать назад. Под старым краном у него был тайник.','Hey, drunk. Your uncle raced here about twelve years ago. He had a stash under the old crane.',PH_T3),
       D('lyokha','Откуда ты знаешь?','How do you know?'),D('tetsu','Я тогда был пацаном и подметал доки. Он дал мне сто иен, чтобы я молчал.','I was a kid sweeping the docks back then. He gave me a hundred yen to keep quiet.',PH_T3)],
  post:[D('misha','«По Харуми я гонял с Куродой. Он знает, что было на Кумо. Найдёшь его — скажи, что я не злюсь».','“I raced Harumi with Kuroda. He knows what happened on Kumo. If you find him, tell him I’m not angry.”',NOTE),
        D('lyokha','Курода… Ещё одно имя.','Kuroda… Another name.'),
        D('kir','И ещё одно: Гэн звонил. В полночь гонка на Вангане. Пять машин, призовые — две с половиной тысячи.','And another one: Gen called. A race on the Wangan at midnight. Five cars, the prize is two and a half thousand.'),
        D('lyokha','Половина взноса. Совпадение?','Half the payment. A coincidence?'),
        D('kir','В этом городе — нет.','Not in this city.')]},
 {id:'d9',ch:3,title:{ru:'Полночь на Вангане',en:'Midnight on the Wangan'},at:'wgs',type:'race5',zone:'wg',reward:2500,
  goal:{ru:'Гонка пятерых: приди первым на Вангане',en:'A five-car race: finish first on the Wangan'},
  why:{ru:'Подпольную гонку собрал Гэн. Призовые — половина взноса.',en:'Gen put together an underground race. The prize is half the payment.'},
  pre:[D('gen','Дамы и господа! Полночь, Ванган, пять машин! Король Скрамбла, Рин Мори, Тэцу «Бульдозер»…','Ladies and gentlemen! Midnight, the Wangan, five cars! The Scramble King, Rin Mori, Tetsu “Bulldozer”…'),
       D('gen','…и гость из «Теней» — Сэйдзи «Линия»!','…and a guest from the Shadows — Seiji “The Line”!'),
       D('seiji','Твоя траектория — шум. Я еду по сигналу.','Your line is noise. I drive by the signal.'),
       D('tetsu','А я еду по тем, кто мешает.','And I drive over whoever gets in the way.'),
       D('rin','Не тормози, ёппарай.','Don’t brake, yopparai.'),
       D('kir','Лёха, смотри за Гэном. Он сегодня какой-то слишком довольный.','Lyokha, watch Gen. He’s way too pleased with himself tonight.',PH_K)],
  post:[D('gen','Ну… поздравляю. Ты опять король.','Well… congratulations. You’re king again.'),
        D('tetsu','Гэн, ты всю гонку прикрывал этого из «Теней». Я видел.','Gen, you covered for that Shadows guy the whole race. I saw it.'),
        D('gen','Что? Я… просто ехал своей линией!','What? I… was just driving my line!'),
        D('seiji','Погрешность в расчётах. Пересчитаю.','An error in the calculations. I’ll recalculate.'),
        D('rin','Неплохо, ёппарай.','Not bad, yopparai.')],
  fail:[D('seiji','Предсказуемо.','Predictable.'),D('gen','Корона снова моя! Ха!','The crown is mine again! Ha!')]},
 {id:'d10',ch:3,title:{ru:'Бульдозер',en:'The Bulldozer'},at:'pad',type:'srace',route:['pad','yd1','yd2','crane'],limit:90,reward:3000,boss:'tetsu',
  goal:{ru:'Гонка по докам против Тэцу и трёх «Бульдозеров»: приди первым',en:'A race through the docks against Tetsu and three Bulldozers: finish first'},
  why:{ru:'Обгонишь Тэцу в его доках — он отдаст все детали и назовёт имя заказчика.',en:'Beat Tetsu in his own docks and he gives back all the parts and names whoever paid him.'},
  pre:[D('tetsu','Ты обогнал меня на Вангане. В моих доках так не выйдет.','You beat me on the Wangan. It won’t work in my docks.'),
       D('tetsu','Я и трое моих «Бульдозеров». Финиш — у старого крана. Обгонишь — отдам всё. И назову имя.','Me and three of my Bulldozers. The finish is at the old crane. Beat me and I give everything back. And name the name.'),
       D('kir','Заманивай их в стены и контейнеры. Тэцу тяжёлый — после удара секунды три в себя приходит.','Lure them into walls and containers. Tetsu is heavy — after a crash he needs about three seconds to come round.',PH_K),
       D('lyokha','Понял.','Got it.')],
  post:function(){var h=S.story.pick!=='rin';return [D('tetsu','…Ладно. Ты не боишься. Это я уважаю.','…Fine. You’re not afraid. I respect that.'),

// ===== Japanese internet radio: list from the Radio Browser directory, played with a plain <audio> =====
var RAD={a:null,list:null,on:false,i:0,busy:false,fails:0,lbl:0,was:false,tok:0};
var RAD_FALLBACK=[{name:'LISTEN.moe · J-Pop',url:'https://listen.moe/fallback'},{name:'Gensokyo Radio',url:'https://stream.gensokyoradio.net/1/'}];
var RAD_API=['https://de1.api.radio-browser.info','https://de2.api.radio-browser.info','https://fi1.api.radio-browser.info','https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info','https://all.api.radio-browser.info'];
function radApp(){return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}
function radFetch(url,ms){return new Promise(function(res,rej){var done=false,t=setTimeout(function(){if(!done){done=true;rej('timeout')}},ms||6000);
 fetch(url,{headers:{'Accept':'application/json'}}).then(function(r){return r.json()}).then(function(j){if(!done){done=true;clearTimeout(t);res(j)}}).catch(function(e){if(!done){done=true;clearTimeout(t);rej(e)}})})}
function radLoad(cb){if(RAD.list&&!RAD.fb){cb();return}RAD.fb=false;
 try{var c=JSON.parse(localStorage.getItem('tokyo_radio')||'null');if(c&&c.list&&c.list.length&&Date.now()-c.t<3*864e5){RAD.list=c.list;cb();return}}catch(e){}
 var qs=['/json/stations/search?countrycode=JP&hidebroken=true&order=clickcount&reverse=true&limit=60','/json/stations/search?tag=jpop&hidebroken=true&order=clickcount&reverse=true&limit=30',
  '/json/stations/search?tag=anime&hidebroken=true&order=clickcount&reverse=true&limit=15','/json/stations/search?tag=city%20pop&hidebroken=true&order=clickcount&reverse=true&limit=10'];
 var k=0;function tryHost(){if(k>=RAD_API.length){RAD.list=RAD_FALLBACK.slice();RAD.fb=true;cb();return}var h=RAD_API[k++];
  Promise.all(qs.map(function(q){return radFetch(h+q).catch(function(){return[]})})).then(function(rs){var seen={},out=[],https=location.protocol==='https:'&&!radApp();
   rs.forEach(function(arr){(arr||[]).forEach(function(s){var u=s.url_resolved||s.url;if(!u||seen[u]||s.hls==1||s.lastcheckok===0)return;var cd=(s.codec||'').toUpperCase();if(cd&&!/MP3|AAC|OGG|OPUS/.test(cd))return;if(/\.m3u8|\.pls|\.m3u$|\.asx/i.test(u))return;if(https&&u.indexOf('https:')!==0)return;
    seen[u]=1;out.push({name:(s.name||'').trim().slice(0,40)||'Radio',url:u,id:s.stationuuid,cc:s.countrycode})})});
   if(!out.length){tryHost();return}RAD.host=h;RAD.list=out.slice(0,40).concat(RAD_FALLBACK.filter(function(f){return!seen[f.url]}));
   try{localStorage.setItem('tokyo_radio',JSON.stringify({t:Date.now(),list:RAD.list}))}catch(e){}cb()}).catch(tryHost)}
 tryHost()}
function radAudio(){if(RAD.a)return RAD.a;var a=new Audio();a.preload='none';a.volume=radVol();RAD.a=a;
 a.addEventListener('playing',function(){RAD.fails=0;RAD.busy=false;radUI()});
 a.addEventListener('error',function(){radFail(RAD.tok)});
 a.addEventListener('stalled',function(){if(RAD.on&&a.paused===false)radUI()});return a}
function radFail(tok){if(tok!==RAD.tok||!RAD.on)return;RAD.tok++;RAD.busy=false;if(++RAD.fails>6){radStop();toast(L('Радио не ловит — проверь интернет'));return}var t=RAD.tok;setTimeout(function(){if(t===RAD.tok&&RAD.on)radGo(1,true)},250)}
function radPlay(){var a=radAudio(),s=RAD.list[RAD.i];if(!s){RAD.on=false;radUI();return}RAD.busy=true;var tok=++RAD.tok;radUI();
 clearTimeout(RAD.to);RAD.to=setTimeout(function(){if(tok===RAD.tok&&RAD.busy)radFail(tok)},12000);
 try{a.src=s.url;var p=a.play();if(p&&p.catch)p.catch(function(e){if(tok!==RAD.tok)return;if(e&&e.name==='NotAllowedError'){radStop();return}if(e&&e.name==='AbortError')return;radFail(tok)})}catch(e){radFail(tok)}
 if(s.id&&RAD.host)fetch(RAD.host+'/json/url/'+s.id).catch(function(){});S.radio=RAD.i;save()}
function radStop(){RAD.on=false;RAD.busy=false;RAD.tok++;clearTimeout(RAD.to);if(RAD.a){try{RAD.a.pause();RAD.a.removeAttribute('src');RAD.a.load()}catch(e){}}radUI()}
function radToggle(){if(RAD.on){radStop();return}RAD.on=true;RAD.busy=true;radUI();radLoad(function(){if(!RAD.on)return;RAD.i=Math.min(RAD.list.length-1,S.radio|0);radPlay()})}
function radGo(d,auto){var start=function(){if(!RAD.list.length)return;RAD.i=(RAD.i+d+RAD.list.length)%RAD.list.length;RAD.on=true;if(!auto)RAD.fails=0;radPlay();RAD.lbl=TIME+3.5};
 if(!RAD.list){RAD.on=true;RAD.busy=true;radUI();radLoad(function(){RAD.i=S.radio|0;start()})}else start()}
function radUI(){var b=$('radt'),n=$('radn');if(!b)return;b.classList.toggle('on',RAD.on);var s=RAD.list&&RAD.list[RAD.i];
 n.textContent=RAD.on?(RAD.busy?L('ловлю…')+(s?' '+s.name:''):'♪ '+(s?s.name:'')):'';n.style.display=RAD.on?'block':'none'}
document.addEventListener('click',function(e){var b=e.target.closest('[data-rad]');if(!b)return;e.preventDefault();var r=b.dataset.rad;if(r==='t')radToggle();else radGo(r==='n'?1:-1)});
document.addEventListener('visibilitychange',function(){if(!RAD.a)return;if(document.hidden){RAD.was=RAD.on;if(RAD.on)try{RAD.a.pause()}catch(e){}}else if(RAD.was&&RAD.on){try{RAD.a.play()}catch(e){}}});
function radVol(){return clamp((S.rvol==null?85:S.rvol)/100,0,1)}
document.addEventListener('input',function(e){if(e.target.dataset&&e.target.dataset.r==='rvol'&&RAD.a)RAD.a.volume=radVol()});

boot();
