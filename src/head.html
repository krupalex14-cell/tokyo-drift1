:root{--bg:#171226;--panel:#251d3d;--line:#45386b;--ink:#fbeff6;--muted:#a898c8;--pk:#ff6fae;--pk2:#ff3d8b;--cy:#6ee7ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"TokyoPx","Courier New",Courier,monospace;font-synthesis:none;font-weight:700;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;font-synthesis:none;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:var(--bg)}
h1{margin:0;font-size:33px;letter-spacing:.06em;text-shadow:3px 3px 0 var(--pk2);line-height:1}
h1 span{display:block;font-size:16.5px;letter-spacing:.5em;color:var(--cy);text-shadow:none;margin-top:6px}
.bar{width:min(320px,80vw);height:14px;border:3px solid var(--line);background:#0e0a1a}.bar i{display:block;height:100%;width:0;background:var(--pk);transition:width .2s}
#load p{color:var(--muted);margin:0}
#gar{display:none;max-width:560px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 30px max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.coins{background:var(--panel);border:3px solid var(--line);padding:6px 12px;color:var(--cy)}
#pv{width:100%;display:block;border:3px solid var(--line);image-rendering:pixelated}
.sec{margin:18px 0 8px;color:var(--muted)}
.desc{color:var(--muted);font-size:16.5px;margin-top:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:var(--panel);border:3px solid var(--line);padding:10px 4px;font-size:16.5px;display:flex;flex-direction:column;gap:4px;align-items:center}
.card small{color:var(--muted);font-size:11px}
.card.on{border-color:var(--pk);box-shadow:4px 4px 0 var(--pk2)}
.card.cur small{color:var(--cy)}
.cinfo{background:var(--panel);border:3px solid var(--line);padding:10px 12px;margin-top:10px}.cinfo>b{display:block;font-weight:inherit;font-size:16.5px;color:var(--pk)}.cinfo .desc{margin:2px 0 8px;font-size:11px}
.cst{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:11px;color:var(--muted)}.cst span{width:86px}.cst i{flex:1;height:7px;background:#0e0a1a}.cst i u{display:block;height:100%;background:var(--cy);text-decoration:none}
.cbt{display:flex;gap:8px;margin-top:10px;align-items:center}.cbt .buy{flex:1}.buy.td{background:#ffd23a;color:#2a2008;box-shadow:3px 3px 0 #9a7a10;flex:0 0 auto}.buy.sure{background:var(--pk);color:#2a0d1c;box-shadow:3px 3px 0 var(--pk2)}
.cok{flex:1;color:var(--cy);font-size:11px}
.buy.lk{background:#3a3050;color:#8a7ea8;box-shadow:none}
#tdb{display:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 150px);transform:translateX(-50%);z-index:6;align-items:center;gap:8px;background:rgba(42,32,8,.94);padding:6px 8px 6px 12px;box-shadow:0 -3px 0 0 #ffd23a,0 3px 0 0 #ffd23a,-3px 0 0 0 #ffd23a,3px 0 0 0 #ffd23a;white-space:nowrap}#tdb span{color:#ffd23a;font-size:11px}#tdb em{display:none}#tdb button{border:0;background:#ffd23a;color:#2a2008;font-size:11px;padding:6px 10px}
.code{display:flex;gap:8px}.code input{flex:1;min-width:0;background:#0e0a1a;border:3px solid var(--line);color:#fbeff6;font:inherit;font-size:16.5px;padding:8px 10px;letter-spacing:.2em}.code button{border:0;background:var(--cy);color:#06202a;padding:0 16px;font-weight:900}
.dev{background:#1a2a20;border:3px solid #7dff8c;padding:10px 12px;margin-top:6px}.dev h3{margin:0 0 6px;color:#7dff8c;font-size:16.5px;font-weight:inherit}.dev .dch{color:#b8f0c0;font-size:11px;margin:10px 0 4px;letter-spacing:.1em}.dev .dms{display:grid;grid-template-columns:1fr 1fr;gap:5px}.dev .dms button{border:0;background:#24402c;color:#e8ffe8;font-size:11px;padding:7px 6px;text-align:left}.dev .dms button.on{background:#7dff8c;color:#0e2a14}.dev .dbt2{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.dev .dbt2 button{flex:1;border:0;background:#7dff8c;color:#0e2a14;font-size:11px;padding:8px 6px;font-weight:900}.dev .dbt2 button.off{background:#3a2c58;color:#fbeff6}
.lkn{margin-top:10px;background:#2a2008;border:3px solid #ffd23a;padding:9px 12px;font-size:11px;color:#ffe9a8;line-height:1.45}.lkn .buy{display:block;width:100%;margin-top:8px;background:#ffd23a;color:#2a2008;box-shadow:3px 3px 0 #9a7a10}
.part{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:3px solid var(--line);padding:10px 12px;margin-bottom:8px}
.part small{color:var(--muted);font-weight:400;font-size:11px}
.pips{display:flex;gap:4px;margin-top:6px}.pips i{width:24px;height:8px;background:var(--line)}.pips i.f{background:var(--pk)}
.buy{background:var(--cy);color:#06202a;border:0;padding:9px 12px;font-weight:900;box-shadow:3px 3px 0 #1d6f86;white-space:nowrap}
.mx{color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:9px}.sw button{width:40px;height:40px;border:3px solid #000;font-size:16.5px}.sw button.on{border-color:#fff;box-shadow:3px 3px 0 var(--pk2)}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opts button{background:var(--panel);border:3px solid var(--line);padding:9px 10px;font-size:16.5px}
.go{display:block;width:100%;margin:22px 0 0;padding:16px;border:0;background:var(--pk);color:#2a0d1c;font-size:22px;font-weight:900;box-shadow:5px 5px 0 var(--pk2)}
.go.alt{background:var(--cy);color:#06202a;box-shadow:5px 5px 0 #1d6f86;margin-top:14px;font-size:16.5px}
.zl div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:2px solid var(--line);font-size:16.5px}.zl b{color:#ffd23a}.zl em{color:var(--line);font-style:normal}
.hint{color:var(--muted);font-size:11px;font-weight:400}
#game{position:fixed;inset:0;display:none;background:#10121e;touch-action:none;overflow:hidden}
#c{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:2px 2px 0 #000;z-index:2}
#tl{position:absolute;left:10px;top:calc(8px + env(safe-area-inset-top))}
#sc{font-size:27.5px;line-height:1}
.lbl{font-size:11px;color:#d8cdf0;margin-bottom:6px}
#mm{width:112px;height:112px;border:0;margin:3px;box-shadow:0 -3px 0 0 rgba(20,16,40,.95),0 3px 0 0 rgba(20,16,40,.95),-3px 0 0 0 rgba(20,16,40,.95),3px 0 0 0 rgba(20,16,40,.95),0 6px 0 0 rgba(0,0,0,.3);border-radius:0;background:#151a2c;pointer-events:auto}
#tr{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top));text-align:right;display:flex;flex-direction:column;align-items:flex-end}
#sp{font-size:27.5px;line-height:1}
.trb{display:flex;gap:10px;margin-top:8px;margin-right:3px}#tr .trb button{pointer-events:auto;background:rgba(37,29,61,.9);border:0;box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),inset 0 -3px 0 0 rgba(0,0,0,.3);padding:6px 9px;font-size:16.5px;text-shadow:none}#tr .trb .ib{padding:3px 6px;display:flex;align-items:center;color:var(--cy)}.ib svg{width:22px;height:22px;display:block}#tr .trb button:active{background:#45386b}
#zp{display:none;pointer-events:auto;margin-top:8px;width:186px;background:rgba(23,18,38,.94);border:3px solid var(--pk);padding:8px 10px 10px;text-align:left;text-shadow:none;box-shadow:4px 4px 0 rgba(255,61,139,.45)}#zp.on{display:block;animation:zpin .25s ease-out}
@keyframes zpin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
#zp .zk{font-size:11px;letter-spacing:.16em;color:var(--pk)}#zp .zn{font-size:16.5px;margin:2px 0 5px;line-height:1.1}#zp .zi{font-size:11px;color:var(--muted);font-weight:400;line-height:1.4}#zp .zi b{color:#ffd23a;font-weight:700}#zp .zi span{color:#3a3050}
#zp .zbt{display:flex;gap:6px;margin-top:8px}#zp .zbt button{border:0;padding:9px 0;font-size:16.5px;font-weight:900}#zp .zbt button:first-child{flex:1;background:var(--pk);color:#2a0d1c;box-shadow:3px 3px 0 var(--pk2)}#zp .zbt button:last-child{width:40px;background:#3a2c58;color:#fff}
#tc{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));width:min(60vw,320px);text-align:center}
#zb{display:none;width:186px;background:rgba(23,18,38,.9);border:3px solid var(--pk);padding:6px 9px 7px;font-size:16.5px;margin-top:8px;text-shadow:none;text-align:left}
