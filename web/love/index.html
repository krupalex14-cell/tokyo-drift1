<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd9ea">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="💗">
<title>💗 For Ari · Для Ари</title>
<style>
:root{--pink:#ff5c9d;--rose:#e8326f;--ink:#5a2342;--ink2:#8a4a6b;--card:rgba(255,255,255,.84)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:ui-rounded,"SF Pro Rounded","Nunito","Quicksand","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#ffe3f0 0%,#ffd0e5 45%,#e8d9ff 100%) fixed;overflow-x:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#bg{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:0}
.fh{position:absolute;bottom:-50px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(-10deg);opacity:0}12%{opacity:.75}88%{opacity:.5}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;margin-bottom:6px}
.top .r{display:flex;gap:8px;align-items:center}
.chip{border:0;background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:15px;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(232,50,111,.15);cursor:pointer;min-height:38px}
button.chip:active{transform:scale(.95)}
#back{visibility:hidden}
#back.show{visibility:visible}
.screen{display:none}
.screen.active{display:block;animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
h1{font-size:32px;line-height:1.12;margin:6px 0 8px;text-align:center;color:var(--rose);text-shadow:0 3px 0 #fff;letter-spacing:-.4px}
h2{font-size:24px;margin:2px 0 8px;text-align:center;color:var(--rose)}
p.sub{margin:0 auto 8px;text-align:center;font-size:15.5px;line-height:1.4;color:var(--ink2);font-weight:700;max-width:380px}
.btn{border:0;font:inherit;font-weight:900;font-size:18px;color:#fff;background:linear-gradient(180deg,#ff82b8,#ff4f95);padding:13px 26px;border-radius:999px;box-shadow:0 6px 0 #d63a78,0 12px 24px rgba(232,50,111,.28);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d63a78,0 6px 14px rgba(232,50,111,.28)}
.btn.sec{background:#fff;color:var(--rose);box-shadow:0 6px 0 #ffc2dc,0 12px 24px rgba(232,50,111,.12)}
.btn.sm{font-size:15px;padding:9px 18px;box-shadow:0 4px 0 #d63a78}
.btn.sec.sm{box-shadow:0 4px 0 #ffc2dc}
.mascots{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:4px 0 0}
.mascot{width:41%;max-width:170px;cursor:pointer;background:none;border:0;padding:0}
.mascot svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(0 8px 10px rgba(232,50,111,.2))}
.mascot.boing{animation:boing .5s}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.12,.88)}60%{transform:scale(.94,1.08)}100%{transform:scale(1)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ear-l{transform-origin:40px 58px;animation:earl 3.2s ease-in-out infinite}
.ear-r{transform-origin:80px 58px;animation:earr 3.8s ease-in-out infinite}
@keyframes earl{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes earr{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
.tail{transform-origin:92px 128px;animation:wag 1.4s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.bubble{min-height:44px;margin:8px auto 4px;max-width:340px;text-align:center;font-weight:800;font-size:16px;color:var(--rose);background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 5px 14px rgba(232,50,111,.15);display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.gcard{position:relative;border:0;font:inherit;color:var(--ink);text-align:center;background:var(--card);border-radius:22px;padding:14px 8px 12px;box-shadow:0 8px 20px rgba(232,50,111,.16);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s}
.gcard:active{transform:scale(.96)}
.gi{font-size:38px;line-height:1.1}
.gt{font-weight:900;font-size:16px;color:var(--rose)}
.gd{font-weight:700;font-size:13px;color:var(--ink2)}
.chk{position:absolute;right:8px;top:6px;font-size:16px;display:none}
.gcard.done .chk{display:block}
.gcard.done{background:linear-gradient(180deg,#fff,#ffeaf4)}
.gcard.final{background:linear-gradient(160deg,#ff9ac6,#ff5c9d)}
.gcard.final .gt,.gcard.final .gd{color:#fff}
.gcard.locked{filter:grayscale(.55);opacity:.85}
.gcard.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.prog{margin:14px 0 0;text-align:center;font-weight:800;color:var(--ink2);font-size:14px}
.bar{height:10px;border-radius:99px;background:#fff;margin:6px auto 0;max-width:260px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ac6,#ff4f95);border-radius:99px;transition:width .5s}
.foot{text-align:center;margin-top:16px}
.foot button{background:none;border:0;font:inherit;font-size:13px;color:var(--ink2);opacity:.7;text-decoration:underline;cursor:pointer}
.gwrap{position:relative;margin:0 auto;width:fit-content;max-width:100%}
canvas.game{display:block;border-radius:22px;box-shadow:0 10px 30px rgba(232,50,111,.22);background:#fff;touch-action:none;-webkit-user-select:none}
canvas.game.glow{animation:glow 1s ease-in-out 2}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,92,157,.35),0 10px 30px rgba(232,50,111,.3)}}
.hud{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:17px;margin:2px auto 8px;color:var(--rose)}
.hud span{background:var(--card);padding:6px 14px;border-radius:99px}
.msg{min-height:44px;text-align:center;font-weight:800;color:var(--ink2);font-size:15.5px;margin:8px 4px;line-height:1.3;display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.ov{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(255,236,246,.9);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border-radius:22px;padding:14px;text-align:center;z-index:5}
.ov.show{display:flex;animation:pop .3s}
.ovbox h3{margin:0 0 6px;font-size:26px;color:var(--rose)}
.ovbox p{margin:0 0 14px;font-weight:700;color:var(--ink2);line-height:1.35}
.ovbox .btn{margin:4px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px auto;max-width:400px}
.mc{aspect-ratio:1;perspective:600px;cursor:pointer}
.mi{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.flip .mi,.mc.ok .mi{transform:rotateY(180deg)}
.mf,.mb{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 5px 12px rgba(232,50,111,.2)}
.mb{background:linear-gradient(135deg,#ff9ac6,#ff5c9d);font-size:24px;color:#fff}
.mf{background:#fff;transform:rotateY(180deg);font-size:34px}
.mc.ok .mf{background:#fff0f7;box-shadow:0 0 0 3px #ffb3d1}
.gift{display:block;margin:2px auto;font-size:88px;line-height:1.1;background:none;border:0;cursor:pointer;animation:wiggle 1.6s ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(232,50,111,.25))}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.05)}}
.ticket{margin:8px auto 0;max-width:340px;background:#fff;border-radius:20px;border:3px dashed #ff8fc0;padding:14px;text-align:center;min-height:112px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.ticket.new{animation:pop .4s}
.ticket .ti{font-size:38px;line-height:1.1}
.ticket .tt{font-weight:900;font-size:18px;line-height:1.3;color:var(--rose);margin-top:4px}
.ticket .tv{font-size:11.5px;font-weight:800;color:var(--ink2);margin-top:8px;letter-spacing:.4px}
.gift.off{animation:none;filter:grayscale(.7) opacity(.45);cursor:default}
.cplist{max-width:340px;margin:10px auto 0;display:flex;flex-direction:column;gap:6px}
.cprow{background:#fff;border:2px dashed #ffb3d1;border-radius:14px;padding:8px 12px;font-weight:800;font-size:14.5px;color:var(--rose);text-align:left;line-height:1.3}
.cpbox{display:block;width:100%;max-width:340px;margin:10px auto 0;height:140px;border-radius:14px;border:2px solid #ffb3d1;padding:10px;font:inherit;font-size:14px;color:var(--ink);background:#fff;-webkit-user-select:text;user-select:text}
.bigq{font-size:60px;text-align:center;line-height:1.1;margin-top:4px}
.runarea{position:relative;height:210px;margin-top:6px}
#no{position:absolute;left:0;top:8px;transition:left .2s ease-out,top .2s ease-out,transform .2s;z-index:2;white-space:nowrap}
#yes{display:block;margin:10px auto 0;transition:font-size .2s,padding .2s}
.env{text-align:center;font-size:84px;line-height:1.1;animation:wiggle 1.6s ease-in-out infinite}
.paper{margin:10px auto;max-width:380px;border-radius:10px;padding:22px 20px;background-color:#fffdf7;background-image:repeating-linear-gradient(transparent,transparent 29px,#ffe0ec 30px);box-shadow:0 12px 30px rgba(232,50,111,.25);font-family:"Segoe Script","Bradley Hand","Marker Felt","Comic Sans MS",ui-rounded,cursive;font-size:18px;line-height:30px;color:#6b2c4d;transform:rotate(-1deg);animation:slide .9s ease both;-webkit-user-select:text;user-select:text}
.paper .to{font-weight:700;margin-bottom:6px}
.paper .from{text-align:right;margin-top:10px;font-weight:700}
@keyframes slide{from{opacity:0;transform:translateY(50px) rotate(-4deg)}to{opacity:1;transform:rotate(-1deg)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#fff;color:var(--rose);font-weight:800;padding:10px 18px;border-radius:99px;box-shadow:0 8px 24px rgba(232,50,111,.3);opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.fh{pointer-events:none}
#intro{position:fixed;left:0;top:0;right:0;bottom:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden;background:linear-gradient(160deg,#ffe3f0 0%,#ffd0e5 45%,#e8d9ff 100%);transition:opacity .8s;cursor:pointer}
#intro.hide{opacity:0;pointer-events:none}
#intro-line{position:relative;font-size:34px;font-weight:900;line-height:1.25;color:var(--rose);max-width:330px;text-shadow:0 3px 0 #fff;opacity:0}
#intro-em{position:relative;font-size:58px;line-height:1;margin-top:16px;opacity:0}
#intro-lang{position:absolute;right:14px;top:calc(10px + env(safe-area-inset-top));z-index:2}
#intro-skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;font-size:13px;font-weight:700;color:var(--ink2);opacity:.7}
@keyframes introLine{0%{opacity:0;transform:translateY(18px) scale(.96);filter:blur(8px)}18%{opacity:1;transform:none;filter:blur(0)}82%{opacity:1;transform:none;filter:blur(0)}100%{opacity:0;transform:translateY(-14px) scale(1.02);filter:blur(6px)}}
@media (prefers-reduced-motion:reduce){.fh{display:none}.gift,.env,.tail,.ear-l,.ear-r{animation:none}}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="fx"></canvas>
<div id="toast"></div>
<div id="intro">
  <button class="chip" id="intro-lang">RU</button>
  <div id="intro-line"></div>
  <div id="intro-em"></div>
  <div id="intro-skip" data-i="intro_skip"></div>
</div>

<div id="app">
  <div class="top">
    <button class="chip" id="back" data-i="back"></button>
    <div class="r"><span class="chip" id="hearts">💗 0</span><button class="chip" id="lang">EN</button></div>
  </div>

  <!-- HOME -->
  <section class="screen active" id="s-home">
    <h1 id="ttl"></h1>
    <p class="sub" data-i="sub"></p>
    <div class="mascots">
      <button class="mascot" id="bunny" aria-label="bunny">
        <svg viewBox="0 0 120 150" aria-hidden="true">
          <g class="ear-l"><ellipse cx="40" cy="30" rx="13" ry="30" fill="#fff" stroke="#f7a8c8" stroke-width="3"/><ellipse cx="40" cy="32" rx="6" ry="21" fill="#ffc1da"/></g>
          <g class="ear-r"><ellipse cx="80" cy="30" rx="13" ry="30" fill="#fff" stroke="#f7a8c8" stroke-width="3"/><ellipse cx="80" cy="32" rx="6" ry="21" fill="#ffc1da"/></g>
          <ellipse cx="60" cy="125" rx="30" ry="24" fill="#fff" stroke="#f7a8c8" stroke-width="3"/>
          <circle cx="60" cy="82" r="34" fill="#fff" stroke="#f7a8c8" stroke-width="3"/>
          <g class="eyes"><ellipse cx="47" cy="80" rx="4.5" ry="6" fill="#5a2342"/><ellipse cx="73" cy="80" rx="4.5" ry="6" fill="#5a2342"/><circle cx="48.6" cy="77.6" r="1.7" fill="#fff"/><circle cx="74.6" cy="77.6" r="1.7" fill="#fff"/></g>
          <ellipse cx="37" cy="92" rx="7" ry="4.5" fill="#ffb3d1" opacity=".75"/><ellipse cx="83" cy="92" rx="7" ry="4.5" fill="#ffb3d1" opacity=".75"/>
          <path d="M55 89 q5 -3 10 0 q-5 6 -10 0z" fill="#ff7eb0"/>
          <path d="M60 94 v3 M60 97 q-5 5 -10 1 M60 97 q5 5 10 1" stroke="#5a2342" stroke-width="2" fill="none" stroke-linecap="round"/>
          <text x="60" y="134" text-anchor="middle" font-size="22">💗</text>
        </svg>
      </button>
      <button class="mascot" id="cat" aria-label="cat">
        <svg viewBox="0 0 120 150" aria-hidden="true">
          <path class="tail" d="M90 130 q28 -4 22 -36" fill="none" stroke="#f0b27a" stroke-width="9" stroke-linecap="round"/>
          <ellipse cx="60" cy="125" rx="30" ry="24" fill="#ffe2b8" stroke="#f0b27a" stroke-width="3"/>
          <path d="M28 66 L32 30 L58 50 Z" fill="#ffe2b8" stroke="#f0b27a" stroke-width="3" stroke-linejoin="round"/>
          <path d="M92 66 L88 30 L62 50 Z" fill="#ffe2b8" stroke="#f0b27a" stroke-width="3" stroke-linejoin="round"/>
          <path d="M36 54 L37 40 L48 49 Z" fill="#ffb3c9"/><path d="M84 54 L83 40 L72 49 Z" fill="#ffb3c9"/>
          <circle cx="60" cy="82" r="34" fill="#ffe2b8" stroke="#f0b27a" stroke-width="3"/>
          <path d="M52 52 v8 M60 50 v9 M68 52 v8" stroke="#f0b27a" stroke-width="3" stroke-linecap="round"/>
          <g class="eyes"><ellipse cx="47" cy="80" rx="4.5" ry="6" fill="#5a2342"/><ellipse cx="73" cy="80" rx="4.5" ry="6" fill="#5a2342"/><circle cx="48.6" cy="77.6" r="1.7" fill="#fff"/><circle cx="74.6" cy="77.6" r="1.7" fill="#fff"/></g>
          <ellipse cx="37" cy="92" rx="7" ry="4.5" fill="#ffb3d1" opacity=".75"/><ellipse cx="83" cy="92" rx="7" ry="4.5" fill="#ffb3d1" opacity=".75"/>
          <path d="M56 89 h8 l-4 5z" fill="#ff7eb0"/>
          <path d="M60 94 v2 M60 96 q-5 5 -10 0 M60 96 q5 5 10 0" stroke="#5a2342" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M30 88 h-15 M31 94 l-14 4 M90 88 h15 M89 94 l14 4" stroke="#c98d5f" stroke-width="2" stroke-linecap="round"/>
          <text x="60" y="134" text-anchor="middle" font-size="22">💗</text>
        </svg>
      </button>
    </div>
    <div class="bubble" id="bubble" data-i="tapme"></div>
    <div class="grid">
      <button class="gcard" id="c-catch" data-go="catch"><span class="chk">✅</span><span class="gi">🐰</span><span class="gt" data-i="g_catch"></span><span class="gd" data-i="d_catch"></span></button>
      <button class="gcard" id="c-draw" data-go="draw"><span class="chk">✅</span><span class="gi">✏️</span><span class="gt" data-i="g_draw"></span><span class="gd" data-i="d_draw"></span></button>
      <button class="gcard" id="c-hoop" data-go="hoop"><span class="chk">✅</span><span class="gi">🏀</span><span class="gt" data-i="g_hoop"></span><span class="gd" data-i="d_hoop"></span></button>
      <button class="gcard" id="c-memory" data-go="memory"><span class="chk">✅</span><span class="gi">🃏</span><span class="gt" data-i="g_memory"></span><span class="gd" data-i="d_memory"></span></button>
      <button class="gcard" id="c-coupon" data-go="coupon"><span class="chk">✅</span><span class="gi">🎁</span><span class="gt" data-i="g_coupon"></span><span class="gd" data-i="d_coupon"></span></button>
      <button class="gcard final locked" id="c-final" data-go="final"><span class="chk">✅</span><span class="gi">💌</span><span class="gt" data-i="g_final"></span><span class="gd" id="final-d"></span></button>
    </div>
    <div class="prog"><span id="prog"></span><div class="bar"><i id="barfill"></i></div></div>
  </section>

  <!-- CATCH -->
  <section class="screen" id="s-catch">
    <h2 data-i="g_catch"></h2>
    <div class="hud"><span id="catch-time">⏱ 30</span><span id="catch-score">💗 0</span></div>
    <div class="gwrap">
      <canvas class="game" id="cv-catch"></canvas>
      <div class="ov" id="ov-catch"><div class="ovbox"><h3></h3><p></p><button class="btn b1"></button><br><button class="btn sec sm b2" data-i="home"></button></div></div>
    </div>
  </section>

  <!-- DRAW -->
  <section class="screen" id="s-draw">
    <h2 data-i="g_draw"></h2>
    <div class="gwrap">
      <canvas class="game" id="cv-draw"></canvas>
      <div class="ov" id="ov-draw"><div class="ovbox"><h3></h3><p></p><button class="btn b1"></button><br><button class="btn sec sm b2" data-i="home"></button></div></div>
    </div>
    <div class="msg" id="draw-msg"></div>
    <div class="row">
      <button class="btn sec sm" id="draw-clear" data-i="draw_clear"></button>
      <button class="btn sec sm" id="draw-hint" data-i="draw_hint"></button>
      <button class="btn sm" id="draw-ok" data-i="draw_check"></button>
    </div>
  </section>

  <!-- HOOP -->
  <section class="screen" id="s-hoop">
    <h2 data-i="g_hoop"></h2>
    <div class="hud"><span id="hoop-score">🏀 0 / 3</span><span>🐱</span></div>
    <div class="gwrap">
      <canvas class="game" id="cv-hoop"></canvas>
      <div class="ov" id="ov-hoop"><div class="ovbox"><h3></h3><p></p><button class="btn b1"></button><br><button class="btn sec sm b2" data-i="home"></button></div></div>
    </div>
    <div class="msg" id="hoop-msg"></div>
  </section>

  <!-- MEMORY -->
  <section class="screen" id="s-memory">
    <h2 data-i="g_memory"></h2>
    <div class="hud"><span id="mem-moves"></span></div>
    <div class="gwrap" style="width:100%">
      <div class="mem" id="mem"></div>
      <div class="ov" id="ov-memory"><div class="ovbox"><h3></h3><p></p><button class="btn b1"></button><br><button class="btn sec sm b2" data-i="home"></button></div></div>
    </div>
  </section>

  <!-- COUPONS -->
  <section class="screen" id="s-coupon">
    <h2 data-i="g_coupon"></h2>
    <div class="msg" id="cp-count"></div>
    <button class="gift" id="gift" aria-label="gift">🎁</button>
    <div class="ticket" id="ticket"></div>
    <div class="cplist" id="cp-list"></div>
    <div class="msg" id="cp-msg"></div>
    <div class="row" id="cp-actions" style="display:none"><button class="btn" id="cp-send" data-i="cp_send"></button><button class="btn sec sm" id="cp-copy" data-i="cp_copy"></button></div>
    <textarea id="cp-box" class="cpbox" readonly style="display:none"></textarea>
  </section>

  <!-- FINAL QUESTION -->
  <section class="screen" id="s-final">
    <div class="mascots" style="margin-top:0">
      <div class="mascot" style="cursor:default;width:34%"><div class="bigq">🐰</div></div>

function analyzeHeart(strokes){
  var pts=[],i,k,s;
  for(s=0;s<strokes.length;s++){ var st=strokes[s]; for(i=0;i<st.length;i++){ var b=st[i]; if(i>0){ var a=st[i-1], d=Math.hypot(b.x-a.x,b.y-a.y), n=Math.floor(d/3); for(k=1;k<n;k++) pts.push({x:a.x+(b.x-a.x)*k/n,y:a.y+(b.y-a.y)*k/n}); } pts.push(b); } }
  if(pts.length<8) return {ok:false,reason:'small'};
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; pts.forEach(function(p){if(p.x<x0)x0=p.x;if(p.x>x1)x1=p.x;if(p.y<y0)y0=p.y;if(p.y>y1)y1=p.y;});
  var w=x1-x0,h=y1-y0; if(w<60||h<60) return {ok:false,reason:'small'};
  var N=pts.map(function(p){return {x:(p.x-x0)/w,y:(p.y-y0)/h};});
  if(N.length>320){ var step=N.length/320; var M=[]; for(i=0;i<320;i++) M.push(N[Math.floor(i*step)]); N=M; }
  var aspect=w/h, sum=0, p,q;
  for(i=0;i<N.length;i++){ p=N[i]; var best=9, rx=1-p.x; for(k=0;k<N.length;k++){ q=N[k]; var dx=q.x-rx, dy=q.y-p.y, dd=dx*dx+dy*dy; if(dd<best)best=dd; } sum+=Math.sqrt(best); }
  var sym=sum/N.length;
  var cTop=1,lTop=1; N.forEach(function(p){ if(p.x>.45&&p.x<.55){ if(p.y<cTop)cTop=p.y; } else if((p.x>.12&&p.x<.4)||(p.x>.6&&p.x<.88)){ if(p.y<lTop)lTop=p.y; } });
  var depth=cTop-lTop;
  var bmin=1,bmax=0,bsum=0,bn=0; N.forEach(function(p){ if(p.y>.84){ if(p.x<bmin)bmin=p.x; if(p.x>bmax)bmax=p.x; bsum+=p.x; bn++; } });
  var bw=bn?bmax-bmin:1, bmean=bn?bsum/bn:.5;
  var L=0,R=0; N.forEach(function(p){ if(p.y>.22&&p.y<.6){ if(p.x<.1)L++; else if(p.x>.9)R++; } });
  var lf=L/N.length, rf=R/N.length;
  var info={aspect:aspect,sym:sym,depth:depth,bw:bw,bmean:bmean,lf:lf,rf:rf};
  var reason=null;
  if(aspect<.7||aspect>1.7) reason='aspect';
  else if(depth<.05||depth>.6) reason='notch';
  else if(bw>.5||Math.abs(bmean-.5)>.14) reason='bottom';
  else if(lf<.02||rf<.02) reason='sides';
  else if(sym>.085) reason='sym';
  info.ok=!reason; info.reason=reason; return info;
}

/* =================== GAME 4: MEMORY =================== */
games.memory=(function(){
  var grid=$('#mem'), ov=$('#ov-memory'), EM=['🐰','🐱','💗','🌹','🍓','🧸','🍰','⭐'], first=null, lock=false, moves=0, found=0;

    shuffle(EM.concat(EM)).forEach(function(e){ var d=document.createElement('div'); d.className='mc'; d.dataset.e=e; d.innerHTML='<div class="mi"><div class="mb">💗</div><div class="mf"></div></div>'; $('.mf',d).textContent=e; d.addEventListener('click',function(){flip(d);}); grid.appendChild(d); }); }

/* =================== GAME 5: COUPONS (exactly 3, then send) =================== */
games.coupon=(function(){
  var COUNT=3, tk=$('#ticket'), list=$('#cp-list'), gift=$('#gift'), actions=$('#cp-actions'), box=$('#cp-box');
  function showTicket(idx,isNew){ var c=T[lang].coupons[idx]; tk.className='ticket'+(isNew?' new':''); tk.textContent='';
    var i=document.createElement('div'); i.className='ti'; i.textContent=c[0]; var tt=document.createElement('div'); tt.className='tt'; tt.textContent=c[1]; var tv=document.createElement('div'); tv.className='tv'; tv.textContent=t('cp_valid'); tk.appendChild(i); tk.appendChild(tt); tk.appendChild(tv); }
  function render(){
    var n=state.coupons.length, full=n>=COUNT;
    setK($('#cp-count'),'cp_count',{n:n});
    if(!n){ tk.className='ticket'; tk.textContent=''; var d=document.createElement('div'); d.className='tt'; d.textContent=t('cp_tap'); tk.appendChild(d); } else showTicket(state.coupons[n-1],false);

    if(!full) box.style.display='none';
  }
  function start(){ render(); }
  function refresh(){ if(current==='coupon') render(); }
  function shareText(){ var lines=['💌 Купоны любви / Love coupons'+(TO?' — '+TO:'')+':'];
    state.coupons.forEach(function(idx,k){ lines.push((k+1)+') '+T.ru.coupons[idx][0]+' '+T.ru.coupons[idx][1]+' / '+T.en.coupons[idx][1]); }); return lines.join('\n'); }
  function legacyCopy(text){ try{ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); var ok=document.execCommand('copy'); document.body.removeChild(ta); return !!ok; }catch(e){ return false; } }
  function manual(text){ box.value=text; box.style.display='block'; try{box.focus();box.select();}catch(e){} toast('cp_manual'); }
  function copy(text){ var ok=function(){toast('cp_copied');};
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok,function(){ if(legacyCopy(text))ok(); else manual(text); }); }

games.final=(function(){

    var fy=(e&&isFinite(e.clientY)&&(e.clientX||e.clientY))?e.clientY-ar.top:nr.top-ar.top+nr.height/2;
