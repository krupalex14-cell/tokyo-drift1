let _bodySeed = 1;
function finishBody(b, parentBody, starBody) {
  b.gm = G * b.M; b.mass = b.M;
  b.g = b.gm / (b.R * b.R);
  b.vesc = Math.sqrt(2 * b.gm / b.R);
  if (b.parent) {
    const P = parentBody;
    const a = b.a, mu = P.gm;
    b.orb = { a, e: b.e || 0, w: (b.varpi || 0) * PI / 180, n: Math.sqrt(mu / (a * a * a)) };
    b.orb.M0 = wrapPI((b.L0 * PI / 180) - b.orb.w);
    b.period = TAU / b.orb.n;
    b.soi = a * Math.pow(b.M / P.M, 0.4);
    b.hill = a * (1 - (b.e || 0)) * Math.cbrt(b.M / (3 * P.M));
    // сфера влияния не должна выходить за холм
    b.soi = Math.max(Math.min(b.soi, b.hill * 0.95), b.R * 4);   // у крошечных тел SOI не меньше 4 радиусов (игровое допущение)
  } else { b.soi = Infinity; }
  if (b.locked) b.rotP = (b.rotP < 0 ? -1 : 1) * (b.period || Math.abs(b.rotP));
  b.rotW = b.rotP ? TAU / b.rotP : 0;
  b.rot0 = ((hashStr(b.id) % 1000) / 1000) * TAU;
  b.children = [];
  b.color = typeof b.color === 'string' ? hex(b.color) : b.color;
  if (b.atm) {
    const A = b.atm;
    // граница атмосферы: плотность < 1e-6 кг/м³
    let top = 0; const lim = 1e-6;
    if (A.dens(0) > lim) { top = 1000; while (A.dens(top) > lim && top < 3e6) top += 1000; }
    A.top = top; A.rho0 = A.dens(0);
    A.sky = hex(A.sky); A.haze = hex(A.haze);
    A.pEdge = 0;
    A.scaleH = A.dens(0) / Math.max(1e-30, Math.abs((A.dens(5000) - A.dens(0)) / 5000));
    // крит. давление на высоте
    A.press = alt => A.dens(alt) * A.Rs * A.Tfn(alt);
    A.temp = alt => A.Tfn(alt);
  }
  b.landable = b.kind !== 'star' && !b.gas;
  b.hasSurface = b.landable;
  // ситуации науки: границы
  b.spaceLow = b.atm ? Math.max(b.atm.top * 2.5, b.R * 0.35) : Math.max(b.R * 0.3, 30e3);
  b.safeAlt = (b.atm ? b.atm.top : 0) + (b.landable ? Math.max(5e3, b.R * 0.005) : 0);

  if (b.biomes && b.biomes.length) b.pal = b.biomes.map(x => ({ name: x[0], c: PAL(x[1].split(',')) }));
  return b;
}

function Universe(def) {

// ============ Рельеф ============
function buildTerrain(b) {
  const T = b.terr, C = TAU * b.R, seed = T.seed | 0;

  let amax = 0; for (const o of oct) amax += o.amp; if (rough) amax += rough.amp * 2; if (crat) amax += C * 0.0; amax *= 1.05;
  b.hMaxEst = amax; b.hMinEst = -amax;
  const NB = Math.max(2, Math.round(C / 4000));
  const ro = []; if (rough) { let lam = rough.lamMax, a = rough.amp; for (let i = 0; i < 20 && lam >= rough.lamMin; i++) { ro.push({ lam, N: Math.max(2, Math.round(C / lam)), amp: a, seed: seed + 500 + i }); lam *= 0.5; a *= Math.pow(0.5, rough.H); } }
  const duneN1 = dune ? Math.max(2, Math.round(C / (dune.lam * 7))) : 2, duneN2 = Math.max(2, Math.round(C / 12000));
  const pn = (th, N, sd) => { const x = th * N / TAU; let i = Math.floor(x), f = x - i; i %= N; if (i < 0) i += N; let j = i + 1; if (j === N) j = 0; const a = hash2(i, sd), bb = hash2(j, sd); f = f * f * f * (f * (f * 6 - 15) + 10); return (a + (bb - a) * f) * 2 - 1; };
  const flatR = 120, flatBlend = 700;  // площадка 120 м, плавный переход 700 м
  const cs = crat ? { levels: crat.levels, dMax: crat.dMax, dens: crat.dens, depth: crat.depth } : null;
  let lastCrater = 0;  // 0 — нет, 1 — внутри, 2 — вал
  function craterSum(x, lod) {
    let sum = 0; lastCrater = 0;
    let D = cs.dMax;
    for (let k = 0; k < cs.levels; k++, D *= 0.45) {
      if (D < lod * 3) break;
      const s = D * 2.4, N = Math.max(1, Math.round(C / s)), cell = C / N;
      const i0 = Math.floor(x / cell);
      for (let di = -1; di <= 1; di++) {
        const i = i0 + di, im = ((i % N) + N) % N;
        if (hash2(im, seed + 1000 + k) > cs.dens) continue;
        const cx = (i + 0.15 + 0.7 * hash2(im, seed + 2000 + k)) * cell;
        const rad = D * 0.5 * (0.55 + 0.45 * hash2(im, seed + 3000 + k));
        const u = Math.abs(x - cx) / rad;
        if (u > 1.8) continue;
        const depth = cs.depth * rad * 2 * (0.6 + 0.4 * hash2(im, seed + 4000 + k));
        let f;
        if (u < 1) { const q = 1 - u * u; f = -depth * q * (0.8 + 0.2 * q); if (u < 0.85 && depth > 15) lastCrater = 1; }
        else { f = 0; }
        const dr = u - 1.05; f += depth * 0.28 * Math.exp(-dr * dr / 0.05) + depth * 0.08 * Math.exp(-(u - 1) * 1.2) * (u > 1 ? 1 : 0);
        if (u >= 0.9 && u < 1.25 && depth > 15 && !lastCrater) lastCrater = 2;

      }
    }
    return sum;
  }
  const self = {
    C, maxH: amax, minH: -amax, NB,
    // высота рельефа [м] над R в точке th (рад, в системе тела); lod — наименьшая длина волны [м]
    h(th, lod) {
      lod = lod || 0.5;
      let e = shift;
      for (let i = 0; i < oct.length; i++) {
        const o = oct[i], n = pn(th, o.N, o.seed);
        e += o.amp * (o.ridge ? (1 - Math.abs(n)) * 1.6 - 0.8 : n);
      }
      for (let i = 0; i < ro.length; i++) { const o = ro[i]; if (o.lam < lod) break; e += o.amp * pn(th, o.N, o.seed); }
      const x = th / TAU * C, xx = ((x % C) + C) % C;
      if (cs) e += craterSum(xx, lod); else lastCrater = 0;
      if (dune) { const ph = TAU * xx / dune.lam; const m = 0.6 + 0.4 * pn(th, duneN1, seed + 777); e += dune.amp * m * (Math.sin(ph + 0.9 * Math.sin(ph * 0.5)) * 0.5 + 0.5 * Math.sin(ph * 2.1)) * 0.6 * smooth(-0.4, 0.2, pn(th, duneN2, seed + 778)); }
      if (bias) {
        const d = Math.abs(wrapPI(th)) * b.R;
        if (d < flatR + flatBlend + 4 * bias[0]) {
          e += bias[1] * Math.exp(-(d / bias[0]) * (d / bias[0]));
          const f = smooth(flatR, flatR + flatBlend, d);
          e = siteH + (e - siteH) * f;
        }
      }
      return e;
    },
    lastCrater() { return lastCrater; },
    bnoise(th, scaleM, salt) { return pnoise(th, Math.max(2, Math.round(C / scaleM)), seed + salt); },
    // индекс биома в th (h — высота, уже вычисленная)
    biome(th, hgt) {

      const mode = b.biome;
      const m = pnoise(th, NB, seed + 901), m2 = pnoise(th, Math.max(2, Math.round(C / 25000)), seed + 902);

        case 'one': return 0;
        case 'earth': {
          if (hgt < sea) return 0; if (hgt < sea + 25) return 1;
          if (hgt > 4200) return 7; if (hgt > 2400) return 6; if (hgt > 900) return 5;
          if (m2 < -0.35) return 4; if (m > 0.3) return 3; return 2;
        }
        case 'elev4': {
          if (nb < 4) return Math.min(nb - 1, 0);
          if (b.sea && hgt < sea + 25) return 0; if (hgt > 3500) return 3; if (hgt > 1200) return 2; return m > 0.3 ? 1 : 0;
        }
        case 'elev3': { if (hgt > 1800) return 1; if (m2 < -0.35 && nb > 2) return 2; return 0; }
        case 'crater4': { const c = lastCrater; if (c === 1) return 2 < nb ? (nb > 3 ? 2 : 1) : 0; if (c === 2) return nb > 3 ? 3 : 0; return m2 < -0.1 ? 1 : 0; }
        case 'crater3': { const c = lastCrater; if (c === 1) return 1; if (c === 2) return Math.min(2, nb - 1); return 0; }
        case 'crater2': { const c = lastCrater; return c ? 1 : 0; }
        case 'lines2': { return (Math.abs(m) > 0.78) ? 1 : 0; }
        case 'mars': {
          if (hgt > 5000) return 4; if (dune && smooth(-0.4, 0.2, pnoise(th, Math.max(2, Math.round(C / 12000)), seed + 778)) > 0.5) return 1;
          if (lastCrater) return 2; if (hgt > 2000) return 3; return 0;
        }
        case 'titan': { if (hgt < sea + 4) return 2; if (dune && smooth(-0.4, 0.2, pnoise(th, Math.max(2, Math.round(C / 12000)), seed + 778)) > 0.5) return 1; if (hgt > 250) return 3; return 0; }
      }
      return 0;
    }
  };
  b.T = self;
  return self;
}

// ---- вспомогательное: ссылка на биом по θ ----
function biomeAt(b, th) {
  if (!b.T || !b.pal) return { id: 0, name: '—' };
  const hgt = b.T.h(th, 8);
  const id = b.T.biome(th, hgt);
  return { id, name: b.pal[id] ? b.pal[id].name : '—', h: hgt };
}

// ---------- готовые ракеты (настоящие прототипы, из настоящих деталей) ----------
// stages: [{e: двигатель, n: сколько, D: диаметр, L: длина бака, tank: тип бака}], payloadId — шаблон-нагрузка
function rocketDesign(name, stages, payloadId, o) {
  o = o || {};
  const payload = TEMPLATES.find(t => t.id === payloadId).make();
  const pl = AutoBuild.payloadInfo(payload);
  const S = stages.map(s => ({ e: PARTS[s.e], n: s.n || 1, D: s.D, L: s.L, tk: PARTS[s.tank || 'tank_kerolox'] }));
  const r = AutoBuild.assemble(null, { atm: true }, pl, payload, { stages: S }, { name, fairing: o.fairing });
  const D = r.design; D._stageLimit = r.nS;
  if (o.ringW) for (const p of D.parts) if (p.defId === 'acs_ring') p.w = o.ringW;      // большой корабль: двигатели ориентации по широкому кольцу
  for (const p of r.payloadParts) if (p.d.eng && !p.d.eng.rcs) p.stage = r.nS + 1;   // двигатель нагрузки включается после отделения
  return D;
}
function rtpl(id, name, real, note, stages, payloadId, o) { tpl(id, name, 'rocket', real, note, () => rocketDesign(name, stages, payloadId, o)); }

// максимальный «уровень технологии» среди деталей
function designTier(parts) { let t = 0; for (const p of parts) t = Math.max(t, p.d.tier || 0); return t; }

// ---------- проверка проекта ----------
// возвращает { issues:[{lvl,text}], ok, stats }
function validateDesign(parts, W, o) {
  o = o || {}; const ch = (W && W.cheats) || {}; const issues = []; const add = (lvl, text) => issues.push({ lvl, text });
  if (!parts.length) { add('err', 'Пусто: добавьте детали'); return { issues, ok: false }; }
  const edges = computeEdges(parts);
  const comps = components(parts, edges);
  if (comps.length > 1) add(ch.overlap ? 'warn' : 'err', 'Деталей-«островов»: ' + comps.length + '. Все детали должны касаться друг друга');
  if (!ch.overlap) {
    const bad = [], seen = new Set();
    for (const p of parts) { const q = overlaps(parts, p); if (q && !seen.has(p.id + ':' + q.id) && !seen.has(q.id + ':' + p.id)) { seen.add(p.id + ':' + q.id); bad.push(p.d.name + ' ⟷ ' + q.d.name); } }
    if (bad.length) add('err', 'Детали пересекаются: ' + bad.slice(0, 3).join('; ') + (bad.length > 3 ? '…' : ''));
  }
  if (!parts.some(p => p.d.core)) add('warn', 'Нет блока управления: аппарат не сможет ориентироваться');
  const engs = parts.filter(p => p.d.eng && !p.d.eng.rcs);
  if (!engs.length) add('warn', 'Нет двигателя');
  else {
    const sec = computeSections(parts, edges);
    for (const e of engs) {
      if (e.d.eng.solid) continue; const prop = e.d.eng.prop; if (e.d.eng.power > 0) { if (!parts.some(p => p.d.solar || p.d.rtg)) add('warn', e.d.name + ': ионному двигателю нужна электроэнергия'); }
      const s = sec.get(e.id); const ok = parts.some(t => t.d.tank && t.d.tank.prop === prop && (sec.get(t.id) === s));
      if (!ok) { add('warn', e.d.name + ': нет бака «' + PROPS[prop].name + '» в той же секции'); break; }
    }
  }
  const noStage = engs.filter(p => p.stage < 0 && !p.d.eng.rcs); if (noStage.length && engs.length) add('warn', 'Двигатель без ступени: назначьте её в окне «Ступени»');
  if (parts.some(p => p.d.core) && !parts.some(p => p.d.rw || (p.d.eng && p.d.eng.rcs) || (p.d.eng && p.d.eng.gim))) {
    const A = attAuthority(parts); if (A.t90 > 45) add('warn', 'Слабое управление поворотом: разворот на 90° займёт ~' + Math.round(A.t90) + ' с. Добавьте РСУ («Кольцо РСУ», Draco) или маховики');
  }
  const ec = parts.reduce((s, p) => s + (p.d.batt || 0), 0), use = parts.reduce((s, p) => s + (p.d.core ? p.d.core.ec : 0), 0);
  if (use > 0 && ec <= 0) add('warn', 'Нет батарей: блок управления остановится в тени');
  let cost = 0, mass = 0; for (const p of parts) { cost += partCost(p); mass += partMassTotal(p); }
  const tier = designTier(parts);
  if (W && !(W.sandbox || ch.freeBuild) && tier > W.tier) add('err', 'Нужна технология ' + tier + ' (сейчас ' + W.tier + ')');
  // габариты площадки
  if (!ch.infField) {
    let top = -1e9, wmax = 0; for (const p of parts) { const r = prect(p); top = Math.max(top, r.y1); wmax = Math.max(wmax, Math.abs(r.x0), Math.abs(r.x1)); }
    if (top > BUILD_H) add('err', 'Выше ангара: ' + top.toFixed(0) + ' м (предел ' + BUILD_H + ' м). Включите «бесконечное поле» в читах');
    if (wmax > BUILD_W) add('err', 'Шире площадки: ' + wmax.toFixed(0) + ' м (предел ±' + BUILD_W + ' м)');
  }
  return { issues, ok: !issues.some(i => i.lvl === 'err'), cost, mass, tier, comps: comps.length };
}
const BUILD_H = 160, BUILD_W = 30;

// Общий список параметров детали (из каталога — настоящие числа)
function partSpecs(d) {
  const R = [], add = (k, v) => R.push([k, v]);
  add('Прототип', d.real); add('Размер', d.w.toFixed(d.w < 1 ? 2 : 1) + ' × ' + d.h.toFixed(d.h < 1 ? 2 : 1) + ' м'); add('Масса (сухая)', fmtMass(d.mass || 0)); add('Цена (справочно)', fmtMoney(d.cost)); add('Технология', 'ур. ' + d.tier);
  if (d.eng) {
    const e = d.eng;
    if (e.rcs) add('Тяга', fmtForce(e.Fv)), add('Удельный импульс', e.IspV + ' с');
    else {
      add('Тяга (вакуум)', fmtForce(e.Fv)); add('Удельный импульс', e.IspV + ' с в вакууме' + (e.IspS > 0 ? ', ' + Math.round(e.IspS) + ' с у земли' : ', у земли не работает'));
      if (e.power > 0) add('Мощность', fmtPow(e.power));
      if (e.thrMin < 1) add('Дросселирование', Math.round(e.thrMin * 100) + '–100 %'); else if (!e.solid) add('Дросселирование', 'нет');
      add('Перезапуск', e.solid ? 'нет — горит до конца' : e.restarts >= 99 ? 'сколько угодно' : e.restarts + ' раз');
      if (e.gim) add('Поворот сопла', '±' + e.gim + '°');
    }
    if (e.prop && PROPS[e.prop]) add('Топливо', PROPS[e.prop].name);
  }
  if (d.tank) add('Топливо', PROPS[d.tank.prop].name + ' · ' + Math.round(PROPS[d.tank.prop].rho) + ' кг/м³');
  if (d.solar) { add('Площадь', d.solar.area + ' м²'); add('Мощность у Земли', fmtPow(d.solar.area * 1361 * d.solar.eff)); add('Нужно развернуть', d.solar.deploy ? 'да' : 'нет'); }
  if (d.rtg) add('Мощность', d.rtg + ' Вт, всегда');
  if (d.batt) add('Ёмкость', (d.batt / 1000).toFixed(2) + ' кВт·ч');
  if (d.ant) { add('Усиление', (10 * Math.log10(d.ant.G)).toFixed(0) + ' дБ'); add('Макс. скорость', fmtBits(d.ant.maxRate / 1000) + '/с'); }
  if (d.core) add('Тип', d.core.rocket ? 'авионика ракеты' : 'управление зонда');
  if (d.rw) add('Момент', d.rw.torque + ' Н·м');
  if (d.inst) { const i = d.inst; add('Измеряет', KIND_NAMES[i.kind] || i.kind); add('Условия', i.sits.map(s => SIT_NAMES[s]).join(', ')); add('Данных за замер', fmtBits(i.data)); add('Время замера', fmtDur(i.time)); add('Энергия', fmtPow(i.ec)); }
  if (d.leg) add('Допустимая скорость', d.leg.tol + ' м/с');
  if (d.wheel) add('Макс. скорость', d.wheel.vmax + ' м/с');
  if (d.chute) add('Купол', '⌀ ' + d.chute.D.toFixed(1) + ' м');
  if (d.shield) add('Нагрев', 'до ' + fmtNum(d.shield.maxFlux / 1e6, 1) + ' МВт/м²');
  return R;
}

    const mp = new Map(used.map((s, i) => [s, i])); for (const p of parts) if (p.stage >= 0) p.stage = mp.get(p.stage);
  },
  // сдвинуть группу деталей: dir −1 = раньше, +1 = позже. Возвращает true, если что-то изменилось
  move(parts, g, dir) {
    const cur = g.parts[0].stage, mx = this.maxStage(parts); let to;
    if (cur < 0) to = mx + 1;                                   // не назначена → в новую последнюю ступень
    else if (dir < 0) { if (cur <= 0) return false; to = cur - 1; }
    else { to = cur + 1; if (to > mx && this.groups(parts, cur).length < 2) return false; }   // единственная в последней — дальше некуда
    for (const p of g.parts) p.stage = to; this.compact(parts); return true;

  // поменять две соседние ступени местами целиком

  nextBrief(v) {

  render(o) {

    if (!o.edit && o.cur > 0) root.append(h('div', { class: 'tiny mut' }, '✔ Уже сработало ступеней: ' + o.cur));
    if (o.edit) root.append(h('div', { class: 'small mut', style: 'line-height:1.35' }, 'Каждое нажатие «СТУП» запускает следующую ступень сверху вниз. ▲ ▼ у детали переносят её в соседнюю ступень, ▲ ▼ в заголовке меняют ступени местами.'));
    let shown = 0;

      if (o.edit) {
        head.append(h('button', { class: 'btn sm', style: 'min-height:26px;padding:2px 8px', onclick: () => { if (k > 0) { this.swap(parts, k, k - 1); o.onChange(); } } }, '▲'),
          h('button', { class: 'btn sm', style: 'min-height:26px;padding:2px 8px', onclick: () => { if (k < mx) { this.swap(parts, k, k + 1); o.onChange(); } } }, '▼'));
      }
      const card = h('div', { class: 'card col stgc' + (isNext ? ' next' : ''), style: 'gap:4px' }, head);

        if (o.edit) {

          row.append(h('button', { class: 'btn sm', style: 'min-height:28px;padding:2px 9px' + (k <= 0 ? ';opacity:.35' : ''), onclick: () => { if (this.move(parts, g, -1)) o.onChange(); } }, '▲'),

      if (auto && t.kind === 'rocket' && t.id !== 'sound') { try { goal = AutoBuild.planGoal(W, null, 200e3); } catch (e) { goal = null; } }
      sh.close(); const ok = this.launch(D, goal, { test: true });
      if (ok && extra) extra(W.active);
    };
    const card = (t, btns) => {
      const D = t.make(); let st = ''; try { const val = validateDesign(D.parts, W, {}); const H = Math.max(...D.parts.map(p => p.y + p.h / 2)); st = fmtMass(val.mass) + ' · высота ' + Math.round(H) + ' м · стоит ' + fmtMoney(val.cost); } catch (e) { }
      return h('div', { class: 'card col', style: 'gap:4px' }, h('b', { class: 'yl' }, t.name), h('div', { class: 'tiny cy' }, t.real), h('div', { class: 'small', style: 'line-height:1.35' }, t.note), h('div', { class: 'tiny mut' }, st), h('div', { class: 'row' }, ...btns));
    };
    const toHangar = t => h('button', { class: 'btn sm sp', onclick: () => { sh.close(); this.go('build', t.make()); } }, '🛠 В ангар');
    for (const t of TEMPLATES.filter(x => x.kind === 'rocket')) b.append(card(t, [toHangar(t), h('button', { class: 'btn go sp', onclick: () => launch(t) }, '▶ Старт')]));
    b.append(h('h3', null, 'Посадочные аппараты'), h('div', { class: 'small mut', style: 'line-height:1.35' }, 'Аппарат сразу над планетой, опоры выпущены, парашюты взведены. Сядьте сами или включите «Автопосадку»: меню слева → «Посадка».'));
    for (const [id, body, alt, vd, vh, where] of [['lander', 'moon', 1800, 20, 55, 'Луна, высота 1,8 км'], ['lander2', 'moon', 1800, 20, 55, 'Луна, высота 1,8 км'], ['lander_mars', 'mars', 6000, 110, 40, 'Марс, высота 6 км'], ['capsule', 'earth', 3500, 120, 40, 'Земля, высота 3,5 км']]) {
      const t = TEMPLATES.find(x => x.id === id); if (!t || !W.U.byId[body]) continue;
      const go = h('button', { class: 'btn go sp', onclick: () => {
        const D = t.make(); sh.close(); if (!this.launch(D, null, { test: true })) return; const v = W.active; W.placeDescent(v, body, alt, vd, vh);
        if (!v.engines.some(p => p.on)) { try { W.stage(v); } catch (e) { } }
        v.throttle = 0; v.sas = 'sretro'; v.rcs = v.rcsList.length > 0; for (const p of v.parts) { if (p.d.leg) p.st.deployed = true; if (p.d.chute || p.d.src) p.st.chute = 'arm'; }
        W.setWarp(0); this.toast(where + '. Гасите скорость и садитесь мягко.', 'info');
      } }, '▶ Тест посадки');
      b.append(card(t, [toHangar(t), go]));
    }
    b.append(h('h3', null, 'Вездеход'));
    for (const t of TEMPLATES.filter(x => x.kind === 'rover')) {
      const go = (body, th) => h('button', { class: 'btn go sp', onclick: () => { const D = t.make(); sh.close(); if (!this.launch(D, null, { test: true })) return; const v = W.active; W.placeOnSurface(v, body, th); this.toast('Вездеход на поверхности: тяга колёс — стрелки/кнопки управления', 'info'); } }, '▶ ' + (W.U.byId[body] ? W.U.byId[body].name : body));
      b.append(card(t, [toHangar(t), W.U.byId.moon ? go('moon', 0.3) : null, W.U.byId.mars ? go('mars', 0.3) : null].filter(Boolean)));
    }
  },
  // ---------- запуск аппарата ----------
  launch(design, goal, o) {
    o = o || {}; const W = App.W; let cost = 0; for (const p of design.parts) cost += partCost(p);
    // всё бесплатно: цена деталей — только справочная
    const D = clonePartsDesign(design); D.name = design.name || 'Ракета'; D.edges = computeEdges(D.parts);
    const v = W.launch(D);
    if (goal) AutoBuild.startMission(W, v, goal, design);
    Store.set('draft', serDesign(design)); this.save(true);
    this.go('flight'); return true;
  }
};

// Карточка с шагом висит сверху и не блокирует экран. Шаг засчитывается сам, когда игрок сделал нужное
// (поставил деталь, включил тягу, выпустил опоры, сел…). Для шагов без проверки есть кнопка «Дальше».
const TUT_SPAWN = {
  // посадочный аппарат в начале спуска (высота м, падение м/с, боковая м/с)
  drop(tplId, body, alt, vd, vh, o) {
    const W = App.W, t = TEMPLATES.find(x => x.id === tplId); const D = clonePartsDesign(t.make()); D.name = (o && o.name) || t.name; D.edges = computeEdges(D.parts);
    const v = W.launch(D); v.tut = true; W.placeDescent(v, body, alt, vd, vh);
    if (!v.engines.some(p => p.on)) { try { W.stage(v); } catch (e) { } }
    v.throttle = 0; for (const p of v.parts) { if (p.d.leg) p.st.deployed = !(o && o.legsIn); if (o && o.armed && (p.d.chute || p.d.src)) p.st.chute = 'arm'; } v.sas = (o && o.sas) || 'sretro'; v.rcs = v.rcsList.length > 0;
    W.switchTo(v); W.setWarp(0); return v;
  },
  orbit(tplId, body, altKm) {
    const W = App.W, t = TEMPLATES.find(x => x.id === tplId); const D = clonePartsDesign(t.make()); D.name = t.name; D.edges = computeEdges(D.parts);
    const v = W.launch(D); v.tut = true; W.placeInOrbit(v, body, altKm * 1000); if (!v.engines.some(p => p.on)) { try { W.stage(v); } catch (e) { } }
    v.throttle = 0; v.sas = 'prograde'; v.rcs = v.rcsList.length > 0; for (const p of v.parts) if (p.d.leg) p.st.deployed = true; W.switchTo(v); W.setWarp(0); return v;
  },
  pad(tplId) {
    const W = App.W, t = TEMPLATES.find(x => x.id === tplId); const D = clonePartsDesign(t.make()); D.name = t.name; D.edges = computeEdges(D.parts);
    const v = W.launch(D); v.tut = true; W.switchTo(v); return v;
  }
};

const Tutor = {
  cur: null, si: 0, card: null, v: null, hl: null, _t: 0, flash: 0, failed: false,
  done() { return Store.get('tut', {}) || {}; },
  open() {
    const W = App.W; const b = h('div', { class: 'col' }); const sh = UI.sheet('🎓 Обучение', b, { height: '86%' }); const dn = this.done();
    b.append(h('div', { class: 'small mut', style: 'line-height:1.35' }, 'Короткие уроки: подсказки висят сверху и не мешают играть, шаги засчитываются сами. Выход — кнопка ✕ на карточке.'));
    for (const L of TUT_LESSONS) {
      b.append(h('div', { class: 'card col', style: 'gap:3px' }, h('div', { class: 'row' }, h('i', { class: 'px', 'data-n': L.icon, style: 'width:26px;height:26px' }), h('b', { class: 'yl sp' }, L.title), dn[L.id] ? h('span', { class: 'gr small' }, '✔') : h('span', { class: 'tiny mut' }, L.time)),
        h('div', { class: 'small', style: 'line-height:1.35' }, L.desc), h('button', { class: 'btn sm go', onclick: () => { sh.close(); this.begin(L.id); } }, dn[L.id] ? 'Пройти ещё раз' : 'Начать')));
    }
  },
  begin(id) {
    if (!App.W) return; this.stop(); const L = TUT_LESSONS.find(x => x.id === id); if (!L) return;
    this.cur = L; this.si = 0; this.v = null; this.failed = false; this.hold = 0;
    try { L.start(); } catch (e) { console.error(e); UI.toast('Не удалось запустить урок: ' + e.message, 'bad'); this.stop(); return; }
    this.show();
  },
  stop() {
    this.cur = null; if (this.card) { this.card.remove(); this.card = null; } this.unhl(); document.body.classList.remove('tut', 'tutfl'); document.body.style.removeProperty('--tuth');
  },
  restart() { const id = this.cur && this.cur.id; this.stop(); if (id) this.begin(id); },
  unhl() { if (this.hl) { this.hl.classList.remove('tut-hl'); this.hl = null; } },
